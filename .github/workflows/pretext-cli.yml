# This file was automatically generated with PreTeXt 2.44.0.
# If you modify this file, PreTeXt will no longer automatically update it.
#
# This workflow file can be used to automatically build a project and create
# an artifact for deployment.  It can also be used to deploy the project to
# GitHub Pages or Cloudflare Pages.
#
# The workflow is triggered on pull requests or can be run manually.  You can uncomment
# the `push` event to have it run on pushes to the main branch as well.
name: PreTeXt-CLI Actions
on:
    # Runs on pull requests
    pull_request:
        branches: ["*"]
    ## Runs on pushes to main
    #push:
    #    branches: ["main"]
    # Runs on demand
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        # Same image as .devcontainer/devcontainer.json, so a local build and a
        # CI build use the same pretext, prefigure, latex and sagemath.
        container: pretextbook/pretext-full:1.9

        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: install deps
              run: pip install -r requirements.txt --break-system-packages

            # Runestone's webpack_static_imports.xml, which every web build downloads,
            # began opening with an XML declaration that names its encoding (November
            # 2026). PreTeXt 2.44 passes that file to lxml as a str, which lxml refuses,
            # so the build stopped with "Unicode strings with encoding declaration are
            # not supported". PreTeXt 2.56.2 fixed it by parsing the bytes instead; this
            # step makes the same one-line change to the installed copy, the one the
            # `pretext` command runs, and changes nothing once requirements.txt pins a
            # version with the fix.
            - name: patch PreTeXt to read the Runestone services file
              run: |
                py="$(sed -n '1s/^#!//p' "$(command -v pretext)")"
                f="$($py -c 'import importlib.util, os; print(os.path.join(os.path.dirname(importlib.util.find_spec("pretext").origin), "core", "pretext.py"))')"
                sed -i 's/services = ET\.fromstring(services_xml)$/services = ET.fromstring(services_xml.encode("utf-8"))/' "$f"
                if grep -n 'ET\.fromstring(services_xml)$' "$f"; then
                  echo "PreTeXt still parses the Runestone services file as a str: $f" >&2
                  exit 1
                fi

            - name: set up node
              uses: actions/setup-node@v4
              with:
                node-version: '22'

            - name: install local ptx files
              run: pretext --version

            - name: build deploy targets
              run: |
                version="$(pretext --version)"
                major="$(echo $version | cut -d '.' -f 1)"
                minor="$(echo $version | cut -d '.' -f 2)"
                if [ "$major" -ge 2 -a "$minor" -ge 5 ]; then
                    echo "PreTeXt version is 2.5 or greater; using new build command"
                    pretext build --deploys
                else
                    echo "PreTeXt version is less than 2.5, using old build command"
                    pretext build
                fi
            - name: stage deployment
              run: pretext deploy --stage-only

            - name: Bundle output/stage as artifact
              uses: actions/upload-artifact@v4
              with:
                  name: deploy
                  path: output/stage

    deploy-cloudflare:
        runs-on: ubuntu-latest
        needs: build
        if: vars.CLOUDFLARE_PROJECT_NAME != ''
        permissions:
          contents: read
          deployments: write

        steps:
            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                  name: deploy
                  path: deploy
            - name: Create 404.html
              run: echo "404 page not found" >> deploy/404.html
            - name: Publish to Cloudflare
              uses: cloudflare/pages-action@v1
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  projectName: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
                  gitHubToken: ${{ secrets.GITHUB_TOKEN }}
                  branch:  ${{ github.head_ref || github.ref_name }}
                  directory: deploy

    deploy-ghpages:
        runs-on: ubuntu-latest
        needs: build
        if: vars.PTX_ENABLE_DEPLOY_GHPAGES == 'yes' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        permissions:
            contents: read
            pages: write
            id-token: write
        concurrency:
            group: "page"
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Download website artifact
              uses: actions/download-artifact@v4
              with:
                  name: deploy
                  path: deploy
            - name: Setup GitHub Pages
              id: check
              uses: actions/configure-pages@v4
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: deploy
            - name: Deploy to Github Pages
              id: deployment
              uses: actions/deploy-pages@v4

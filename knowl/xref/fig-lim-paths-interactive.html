<div class="para" id="interactive-lim-paths-1-1">The floor of the picture is the <span class="process-math">\(xy\)</span>-plane and the surface above it is <span class="process-math">\(z = f(x,y) = \frac{xy}{x^2+y^2}\text{.}\)</span> The three coloured lines on the floor are the paths <span class="process-math">\(y=0\text{,}\)</span> <span class="process-math">\(x=0\)</span> and <span class="process-math">\(y=x\text{;}\)</span> click one, or use the buttons, to draw the part of the surface lying over it. The value that path approaches is written beside it and collected in the panel above the picture. “Approach <span class="process-math">\((0,0)\)</span>” slides a point in along every chosen path at once, “Top view” looks straight down at the three lines, and dragging turns the picture.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#interactive-lim-paths-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>

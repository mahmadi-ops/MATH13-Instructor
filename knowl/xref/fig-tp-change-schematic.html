<div class="para" id="fig-tp-change-schematic-2-2-1">In the x y plane, a black arrow u d s leaves the blue point P 0 with coordinates x 0, y 0 and ends at the red point P with coordinates x 0 plus u 1 d s, y 0 plus u 2 d s. Its component u 1 d s i along the x axis is drawn in orange and its component u 2 d s j along the y axis in green. Above the plane is a grey surface, the graph of z equals f of x y. Dashed vertical segments rise from P 0 and from P to the surface, where a blue point marks the height f of x 0, y 0 and a red point marks the height of f at P; a black curve on the surface joins them. A dashed horizontal segment carries the first height across to the second vertical segment, and a red double arrow between the two heights is labeled delta f.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig-tp-change-schematic-2-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

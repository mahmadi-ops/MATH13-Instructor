\frac{\partial w}{\partial x}
= \frac{\partial w}{\partial u}\frac{\partial u}{\partial x}
= \frac{\partial w}{\partial u}\,z
\qquad\Longrightarrow\qquad
\frac{\partial w}{\partial u} = \frac{1}{z}\frac{\partial w}{\partial x}.\tag{4.4.6}
\end{equation}

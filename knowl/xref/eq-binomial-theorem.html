\begin{equation}
(1+x)^n = \sum_{k=0}^{n} \binom{n}{k} x^k
= 1 + nx + \frac{n(n-1)}{2!}x^2 + \cdots + nx^{n-1} + x^n.\tag{2.4.3}
\end{equation}

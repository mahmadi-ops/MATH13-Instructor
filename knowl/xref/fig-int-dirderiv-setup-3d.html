<div class="para" id="interactive-dirderiv-setup-3d-1-1">The translucent blue surface is the graph of <span class="process-math">\(z = f(x,y)\text{.}\)</span> In the <span class="process-math">\(xy\)</span>-plane below it, the point <span class="process-math">\(P_0(x_0,y_0)\)</span> is fixed, the short blue arrow is the unit vector <span class="process-math">\(\hat{u}\text{,}\)</span> and the gold arrow is the displacement <span class="process-math">\(s\hat{u}\text{,}\)</span> which ends at the point <span class="process-math">\(P(x_0+su_1,\, y_0+su_2)\text{.}\)</span> The dashed vertical lines rise from <span class="process-math">\(P_0\)</span> and <span class="process-math">\(P\)</span> to the surface, where the values <span class="process-math">\(f(P_0)\)</span> and <span class="process-math">\(f(P)\)</span> are marked. Drag the slider to change the distance <span class="process-math">\(s\text{,}\)</span> or press “s <span class="process-math">\(\to\)</span> 0” to animate the limit in the definition of the directional derivative: as <span class="process-math">\(s \to 0\text{,}\)</span> the point <span class="process-math">\(P\)</span> slides back toward <span class="process-math">\(P_0\)</span> and the difference quotient <span class="process-math">\(\big(f(P) - f(P_0)\big)/s\text{,}\)</span> displayed above the figure, approaches <span class="process-math">\(\left(D_{\hat{u}} f\right)_{P_0}\text{.}\)</span> Drag the figure to view it from a different angle, or press “Rotate” to spin it.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#interactive-dirderiv-setup-3d-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

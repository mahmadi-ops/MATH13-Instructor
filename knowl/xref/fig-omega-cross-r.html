<div class="para" id="fig-omega-cross-r-2-1-1">A circular orbit in the horizontal plane drawn in an oblique view, with the z-axis vertical. The angular velocity vector points straight up along the z-axis from the centre O. The position vector runs from O out to the particle on the orbit, and the velocity vector at the particle is tangent to the orbit, equal to the cross product of the angular velocity with the position vector.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig-omega-cross-r-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">3.4.30<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>The velocity of a particle in circular motion is <span class="process-math">\(\overrightarrow{v} = \overrightarrow{\omega} \times \overrightarrow{r}\text{.}\)</span> Because <span class="process-math">\(\overrightarrow{\omega}\)</span> and <span class="process-math">\(\overrightarrow{r}\)</span> are perpendicular, the speed is <span class="process-math">\(\omega r\text{,}\)</span> and the right-hand rule places <span class="process-math">\(\overrightarrow{v}\)</span> tangent to the orbit in the direction of travel.<div class="autopermalink" aria-hidden="true" data-description="Figure 3.4.30"><a tabindex="-1" href="#fig-omega-cross-r" title="Copy heading and permalink for Figure 3.4.30" aria-label="Copy heading and permalink for Figure 3.4.30">🔗</a></div></figcaption>

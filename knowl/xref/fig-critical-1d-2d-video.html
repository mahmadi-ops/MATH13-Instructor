<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">4.7.12<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>Critical points of a curve <span class="process-math">\(y = f(x)\)</span> beside those of a surface <span class="process-math">\(z = f(x,y)\text{,}\)</span> for the examples of this section: the minimum of <span class="process-math">\(y = x^2\)</span> and of <span class="process-math">\(z = x^2 + y^2\text{,}\)</span> the maximum of <span class="process-math">\(y = -x^2\)</span> and of <span class="process-math">\(z = -x^2 - y^2\text{,}\)</span> and the corner of <span class="process-math">\(y = \lvert x \rvert\)</span> and the tip of the cone <span class="process-math">\(z = \sqrt{x^2 + y^2}\text{;}\)</span> in each pair the curve is the slice <span class="process-math">\(y = 0\)</span> of the surface. The saddle <span class="process-math">\(z = y^2/3 - x^2/3\)</span> bends down along the <span class="process-math">\(x\)</span>-axis and up along the <span class="process-math">\(y\)</span>-axis. A curve has only one direction through the point, so it bends one way only, and the saddle has no one-variable counterpart; <span class="process-math">\(y = x^3\text{,}\)</span> which is neither a maximum nor a minimum at <span class="process-math">\(0\text{,}\)</span> does not bend there at all.<div class="autopermalink" aria-hidden="true" data-description="Figure 4.7.12"><a tabindex="-1" href="#fig-critical-1d-2d-video" title="Copy heading and permalink for Figure 4.7.12" aria-label="Copy heading and permalink for Figure 4.7.12">🔗</a></div></figcaption>

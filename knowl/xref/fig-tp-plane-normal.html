<div class="para" id="fig-tp-plane-normal-2-1-1">A grey dome-shaped surface, the graph of z equals f of x y, with the pink tangent plane touching it at the magenta point P 0. The green curve cut by the plane y equals y 0 and the amber curve cut by the plane x equals x 0 run across the surface through P 0, drawn in the same colors as the two partial derivative figures. The blue tangent line to the green curve at P 0 and the dark red tangent line to the amber curve at P 0 lie inside the tangent plane, and a black arrow, the normal vector n, points away from the plane at P 0, perpendicular to both tangent lines. A legend above the picture names each of these seven elements.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig-tp-plane-normal-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">4.6.1<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>The two vertical planes <span class="process-math">\(y = y_0\)</span> and <span class="process-math">\(x = x_0\)</span> cut the surface <span class="process-math">\(z = f(x,y)\)</span> along the green and amber curves of <a href="sec-pd-definition.html#fig-pd-tangent-x" class="xref" data-knowl="./knowl/xref/fig-pd-tangent-x.html" data-reveal-label="Reveal" data-close-label="Close" title="Figure 4.3.1">Figure 4.3.1</a> and <a href="sec-pd-definition.html#fig-pd-tangent-y" class="xref" data-knowl="./knowl/xref/fig-pd-tangent-y.html" data-reveal-label="Reveal" data-close-label="Close" title="Figure 4.3.2">Figure 4.3.2</a>, whose tangent lines at <span class="process-math">\(P_0\)</span> have slopes <span class="process-math">\(f_x(x_0,y_0)\)</span> and <span class="process-math">\(f_y(x_0,y_0)\text{.}\)</span> The tangent plane at <span class="process-math">\(P_0\)</span> contains both tangent lines, and its normal vector is <span class="process-math">\(\mathbf n = \nabla w \Big|_{P_0}\text{.}\)</span> Equivalently, <span class="process-math">\(\mathbf n\)</span> is given (up to sign) by the cross product of the direction vectors <span class="process-math">\(\hat{\imath} + f_x(x_0,y_0)\,\hat{k}\)</span> and <span class="process-math">\(\hat{\jmath} + f_y(x_0,y_0)\,\hat{k}\)</span> of the two tangent lines.<div class="autopermalink" aria-hidden="true" data-description="Figure 4.6.1"><a tabindex="-1" href="#fig-tp-plane-normal" title="Copy heading and permalink for Figure 4.6.1" aria-label="Copy heading and permalink for Figure 4.6.1">🔗</a></div></figcaption>

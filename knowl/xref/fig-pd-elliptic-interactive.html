<div class="para" id="interactive-pd-elliptic-1-1">The dome is <span class="process-math">\(z = 4-x^2-2y^2\)</span> and the white point is <span class="process-math">\(P(1,1,1)\text{.}\)</span> Click “<span class="process-math">\(y=1\)</span>” or “<span class="process-math">\(x=1\)</span>”, or click a parabola in the picture, to slice the dome with that plane: the parabola cut out of it is drawn on the surface and the tangent line to that parabola at <span class="process-math">\(P\)</span> follows, labelled with its slope. Those slopes are the two partial derivatives, and the legend collects them. “Along <span class="process-math">\(y\)</span>” and “Along <span class="process-math">\(x\)</span>” turn the picture until the <span class="process-math">\(y=1\)</span> and <span class="process-math">\(x=1\)</span> slices respectively are seen edge on, at their true steepness; dragging turns it by hand.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#interactive-pd-elliptic-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

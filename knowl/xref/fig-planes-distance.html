<div class="para" id="fig-planes-distance-2-1-1">A parallelogram represents a plane seen in perspective. From a point P on the plane, a blue normal vector n points straight up and a green vector points up and to the right to a point S above the plane. A dashed dark red segment drops vertically from S to the plane; its length d is the distance from S to the plane, which equals the magnitude of the projection of P S onto n. A small square corner mark where the dashed segment meets the plane shows that the segment is perpendicular to the plane.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig-planes-distance-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

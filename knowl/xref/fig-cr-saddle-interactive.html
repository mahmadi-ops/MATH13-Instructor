<div class="para" id="interactive-cr-saddle-1-1">The saddle is <span class="process-math">\(z = xy\text{,}\)</span> the mauve ring below it is the unit circle <span class="process-math">\(x = \cos t\text{,}\)</span> <span class="process-math">\(y = \sin t\text{,}\)</span> and the green curve is the path traced on the saddle as <span class="process-math">\(t\)</span> increases. The white point marks the current <span class="process-math">\(t\text{;}\)</span> the arrow on it points along the curve and grows with <span class="process-math">\(\left|\frac{dw}{dt}\right|\text{,}\)</span> turning amber where the height is rising and red where it is falling. The three coloured dots are the marked points <span class="process-math">\(t=0\text{,}\)</span> <span class="process-math">\(t=\pi/4\)</span> and <span class="process-math">\(t=\pi/2\text{.}\)</span> Drag the picture to turn it.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#interactive-cr-saddle-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

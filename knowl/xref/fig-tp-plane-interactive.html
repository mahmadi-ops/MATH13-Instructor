<div class="para" id="interactive-tp-plane-1-1">The surface and the point <span class="process-math">\(P_0\)</span> are those of the figure above. Add the layers with the buttons — the slice <span class="process-math">\(y = y_0\)</span> with its blue tangent line, the slice <span class="process-math">\(x = x_0\)</span> with its dark red tangent line, the pink tangent plane, and the normal vector <span class="process-math">\(\mathbf n\)</span> — in any order, or press “Build it up” to watch them arrive one at a time. The values of <span class="process-math">\(f_x\text{,}\)</span> <span class="process-math">\(f_y\)</span> and <span class="process-math">\(\mathbf n\)</span> are collected in the panel above the picture. “Side view” looks straight down the <span class="process-math">\(y\)</span> axis so the slope of the blue tangent line can be read directly, “Spin” turns the picture, and dragging rotates it by hand.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#interactive-tp-plane-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

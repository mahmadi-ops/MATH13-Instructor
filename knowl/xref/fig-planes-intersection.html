<div class="para" id="fig-planes-intersection-2-1-1">Two planes intersect inside a three dimensional box: a horizontal blue plane and a slanted pink plane, meeting at an oblique angle rather than a right angle. Both normal vectors leave the same marked point on the line where the planes meet. The blue vector n one points straight up, perpendicular to the blue horizontal plane; the pink vector n two points up and to the side, perpendicular to the pink slanted plane. A black vector runs along the crease where the planes meet. A legend in the upper right names the three vectors: n one, n two, and v equals n one cross n two. A square corner mark on either side of the common point, drawn in the colour of its normal, shows that each normal makes a right angle with that line.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig-planes-intersection-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

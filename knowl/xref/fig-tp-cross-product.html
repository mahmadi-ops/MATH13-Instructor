<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">4.6.2<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>The tangent plane at <span class="process-math">\(P_0\)</span> contains <span class="process-math">\(\mathbf v_1\)</span> and <span class="process-math">\(\mathbf v_2\text{,}\)</span> and with them the parallelogram they span. The cross product <span class="process-math">\(\mathbf v_1 \times \mathbf v_2 = -f_x\,\hat{\imath} - f_y\,\hat{\jmath} + \hat{k}\)</span> is perpendicular to both vectors, so it is normal to the tangent plane. Taking the cross product in the other order gives the opposite normal vector <span class="process-math">\(\mathbf n = \mathbf v_2 \times \mathbf v_1 = f_x\,\hat{\imath} + f_y\,\hat{\jmath} - \hat{k}\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Figure 4.6.2"><a tabindex="-1" href="#fig-tp-cross-product" title="Copy heading and permalink for Figure 4.6.2" aria-label="Copy heading and permalink for Figure 4.6.2">🔗</a></div></figcaption>

<div class="para" id="fig-tp-linear-approx-1d-2-2-1">The graph of a curve y equals f of x. At a point x on the curve, a right triangle formed by the tangent line has horizontal leg d x and vertical leg d f, equal to f prime of x times d x. A vertical bracket to the left, labeled delta f, marks the actual rise of the curve, f of x plus d x minus f of x, and brackets to the right show the differential d f equals f prime of x times d x above the baseline height f of x. The curve ends slightly above the tangent line at x plus d x.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig-tp-linear-approx-1d-2-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

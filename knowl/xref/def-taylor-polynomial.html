<article class="definition definition-like"><h2 class="heading">
<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">2.2.2</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Taylor Polynomial of Order <span class="process-math">\(n\)</span>.</span>
</h2>
<div class="para logical">
<div class="para">The <dfn class="terminology">Taylor polynomial of order <span class="process-math">\(n\)</span></dfn> generated by <span class="process-math">\(f\)</span> at <span class="process-math">\(x = a\)</span> is the polynomial</div>
<div class="displaymath process-math">
\begin{equation*}
p_n(x) = f(a) + f'(a)(x-a) + \frac{f''(a)}{2!}(x-a)^2 + \cdots
+ \frac{f^{(n)}(a)}{n!}(x-a)^n.
\end{equation*}
</div>

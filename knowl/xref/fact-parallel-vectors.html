<div class="para">From <a href="sec-cross-definition.html#eq-cross-geometric" class="xref" data-knowl="./knowl/xref/eq-cross-geometric.html" data-reveal-label="Reveal" data-close-label="Close" title="Equation 3.4.1">(3.4.1)</a>, it follows that the cross product of two parallel vectors is zero.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fact-parallel-vectors-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>

\begin{equation}
\mathbf u \parallel \mathbf v \iff \mathbf u \times \mathbf v = \mathbf 0,
\qquad \mathbf u, \mathbf v \neq \mathbf 0.\tag{3.4.3}
\end{equation}
</div>

<div class="para" id="interactive-taylor-approx-manim-1-1">Press “Play” to build the polynomials in order: the flat line <span class="process-math">\(p_0\)</span> matches only the height at the centre, <span class="process-math">\(p_1\)</span> adds the slope and becomes the tangent line, <span class="process-math">\(p_2\)</span> adds the curvature, and each later term bends the blue curve into agreement with <span class="process-math">\(f\)</span> over a wider stretch. The shaded green band is the interval on which <span class="process-math">\(p_n\)</span> stays within <span class="process-math">\(0.1\)</span> of <span class="process-math">\(f\text{;}\)</span> watch it widen as the order climbs. Stop the animation at any time and set the order <span class="process-math">\(n\)</span> yourself, or use the <span class="process-math">\(p_1, p_2, p_3\)</span> buttons to return to the three polynomials of <a href="sec-taylor-definitions.html#fig-taylor-exp" class="xref" data-knowl="./knowl/xref/fig-taylor-exp.html" data-reveal-label="Reveal" data-close-label="Close" title="Figure 2.2.5">Figure 2.2.5</a>. The second slider moves the centre <span class="process-math">\(a\)</span> away from <span class="process-math">\(0\text{,}\)</span> which rebuilds the whole family at a new point of the curve. “Trails” leaves the earlier polynomials on screen in faint gold so the family can be seen closing in together.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#interactive-taylor-approx-manim-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>

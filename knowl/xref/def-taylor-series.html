<article class="definition definition-like"><h2 class="heading">
<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">2.2.1</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Taylor Series.</span>
</h2>
<div class="para logical">
<div class="para">The <dfn class="terminology">Taylor series generated by <span class="process-math">\(f\)</span> at <span class="process-math">\(x = a\)</span></dfn> is</div>
<div class="displaymath process-math">
\begin{align*}
\sum_{k=0}^{\infty} \frac{f^{(k)}(a)}{k!}(x-a)^k
\amp = f(a) + f'(a)(x-a) + \frac{f''(a)}{2!}(x-a)^2 + \cdots\\
\amp \quad + \frac{f^{(n)}(a)}{n!}(x-a)^n + \cdots
\end{align*}
</div>

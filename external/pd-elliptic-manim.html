<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The two traces on z = 4 - x&#178; - 2y&#178; -- animated</title>
<!-- The same two families the book itself loads (see pretext-html.xsl), so the
     figure's lettering matches the surrounding page rather than the reader's
     system UI font: Open Sans for text, PT Serif for the mathematics. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,300..800&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
  /* Manim-style palette: dark stage, saturated accents, light serif math.
     Kept in step with the book's other animated figures. */
  :root {
    --bg:        #06070a;
    --panel:     #101218;
    --edge:      #262a36;
    --ink:       #ece6e2;
    --dim:       #9aa0ad;
    --blue:      #58c4dd;
    --green:     #83c167;
    --yellow:    #ffe14d;
    --red:       #fc6255;
    --gold:      #f0ac5f;
    --sans:  "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif: "PT Serif", "Times New Roman", Times, serif;
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
               background: var(--bg); }
  body { font-family: var(--sans); color: var(--ink);
         -webkit-font-smoothing: antialiased; }
  #app { width: 100%; height: 100%; box-sizing: border-box;
         display: flex; flex-direction: column; }

  /* ---- stage ---- */
  #stage { position: relative; width: 100%; background: var(--bg);
           flex: 1 1 auto; min-height: 0; overflow: hidden; }
  /* the renderer is sized with updateStyle off, so the canvas has to be told
     to fill the stage in CSS -- otherwise it draws at its buffer size, which is
     devicePixelRatio times too big, and the picture overflows the frame. */
  #stage canvas { display: block; width: 100%; height: 100%;
                  cursor: grab; touch-action: none; }
  #stage canvas:active { cursor: grabbing; }
  #stage canvas.pick { cursor: pointer; }

  .overlay { position: absolute; pointer-events: none; }

  /* one legend, top-left: the function, the point, and what the chosen
     slices report. There is deliberately nothing else drawn over the stage. */
  #legend {
    top: 12px; left: 14px;
    padding: 9px 13px 10px 13px;
    background: rgba(16,18,24,0.72);
    border: 1px solid var(--edge);
    border-left: 3px solid var(--blue);
    border-radius: 6px;
    line-height: 1.5;
  }
  .math { font-family: var(--serif); font-size: 16px; }
  .math i { font-style: italic; }
  #legend .head { color: #9cdceb; }
  #legend .head .at { color: var(--ink); }
  #rows { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--edge); }
  #rows .row {
    display: flex; align-items: baseline; gap: 8px;
    font-family: var(--serif); font-size: 15px; color: var(--ink);
  }
  #rows .row + .row { margin-top: 4px; }
  #rows .row .swatch {
    width: 16px; height: 3px; border-radius: 2px; flex: 0 0 auto;
    transform: translateY(-4px);
  }
  #rows .row .val { margin-left: auto; font-weight: 700; padding-left: 14px; }
  #rows .empty { font-family: var(--sans); font-size: 12.5px;
                 font-style: italic; color: var(--dim); }

  /* ---- control panel ---- */
  #panel {
    flex: 0 0 auto; border-top: 1px solid var(--edge);
    background: var(--panel); padding: 9px 12px 11px 12px; box-sizing: border-box;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .row + .row { margin-top: 9px; }
  .lbl { font-size: 13px; color: var(--dim); }

  button {
    font: inherit; font-size: 13.5px;
    padding: 5px 12px; border-radius: 999px;
    color: var(--ink); background: #1a1d26;
    border: 1px solid var(--edge);
    cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  }
  button:hover { background: #232734; }
  button .eq { font-family: var(--serif); font-style: italic; }
  /* an active path button wears its own colour, set from the palette in JS */
  button.on { color: #06070a; font-weight: 700; }
  #btnSpin.on, #btnEyeY.on, #btnEyeX.on {
    background: var(--blue); border-color: var(--blue);
    color: #06070a; font-weight: 600;
  }

  @media (max-width: 620px) {
    #legend { padding: 7px 10px 8px 10px; top: 10px; left: 10px; }
    .math { font-size: 14px; }
    #rows .row { font-size: 13px; }
    .lbl { display: none; }
    button { font-size: 12.5px; padding: 4px 10px; }
  }
</style>
</head>

<body>
<div id="app">
  <div id="stage">
    <div id="legend" class="overlay">
      <div class="math head">
        <i>z</i> = 4 &#8722; <i>x</i>&#178; &#8722; 2<i>y</i>&#178;
        <span class="at">at <i>P</i>(1,&#8202;1,&#8202;1)</span>
      </div>
      <div id="rows"><div class="empty">no slice chosen yet</div></div>
    </div>

  </div>

  <div id="panel">
    <div class="row">
      <span class="lbl">Slice:</span>
      <button class="cutBtn" data-i="0"><span class="eq">y</span> = 1</button>
      <button class="cutBtn" data-i="1"><span class="eq">x</span> = 1</button>
      <button id="btnAll">Both</button>
      <button id="btnClear">Clear</button>
      <span style="flex:1"></span>
      <span class="lbl">View:</span>
      <button id="btnEyeY">Along <span class="eq">y</span></button>
      <button id="btnEyeX">Along <span class="eq">x</span></button>
      <button id="btnSpin">Spin</button>
      <button id="btnReset">Reset</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  // Manim colour constants, so the palette below reads the way a Scene would.
  var BLUE_C = 0x58c4dd, GREEN_C = 0x83c167, GOLD_C = 0xf0ac5f,
      RED_C = 0xfc6255, INK = 0xece6e2;

  // ---------- the construction ----------
  // The same surface, point and slices the two static figures draw. The colours
  // are the ones the animated figure for the previous section uses: the slice
  // that holds y fixed is green with a blue tangent, the one that holds x fixed
  // is amber with a red tangent.
  function f(x, y) { return 4 - x * x - 2 * y * y; }
  var X0 = 1, Y0 = 1, Z0 = f(X0, Y0);            // P(1,1,1)
  var FX = -2 * X0, FY = -4 * Y0;                // -2 and -4
  var XR = 2, YR = Math.SQRT2;                   // the dome sits over x^2/4 + y^2/2 = 1
  var ZK = 0.62;                                 // z drawn at this fraction of the
                                                 // horizontal scale, or the dome
                                                 // towers over the frame

  var CUTS = [
    { key: "y1", tex: "y = 1", colour: GREEN_C, css: "#83c167",
      tan: BLUE_C, tanCss: "#58c4dd", slope: -2,
      trace: "z = f(x,1) = 2 - x^2", label: "C1",
      curve: function (t) { return [t, Y0, f(t, Y0)]; },
      span: 1.41, dir: [1, 0, FX], reach: 0.95 },
    { key: "x1", tex: "x = 1", colour: GOLD_C, css: "#f0ac5f",
      tan: RED_C, tanCss: "#fc6255", slope: -4,
      trace: "z = f(1,y) = 3 - 2y^2", label: "C2",
      curve: function (t) { return [X0, t, f(X0, t)]; },
      span: 1.22, dir: [0, 1, FY], reach: 0.62 }
  ];

  // ---------- renderer / scene ----------
  var stage = document.getElementById("stage");
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.appendChild(renderer.domElement);
  var canvas = renderer.domElement;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x06070a);

  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
  camera.up.set(0, 0, 1);

  function P3(x, y, z) { return new THREE.Vector3(x, y, ZK * z); }

  var CENTER = P3(0, 0, 2.15);
  var radius = 9, theta = -0.98, phi = 1.20, aspect = 1;
  var targetPhi = null, targetTheta = null;

  // CLOUD samples what is actually drawn, so the camera can sit at the smallest
  // distance that still shows all of it from the current angle.
  var CLOUD = (function () {
    var pts = [], k, t;
    for (k = 0; k < 16; k++) {
      t = 2 * Math.PI * k / 16;
      pts.push(P3(XR * 1.12 * Math.cos(t), YR * 1.12 * Math.sin(t), 0));
      pts.push(P3(XR * 0.75 * Math.cos(t), YR * 0.75 * Math.sin(t), 4.5));
    }
    return pts.map(function (p) { return p.sub(CENTER); });
  })();

  var _e = new THREE.Vector3(), _upv = new THREE.Vector3(), _rt = new THREE.Vector3();
  function computeRadius() {
    _e.set(Math.sin(phi) * Math.cos(theta), Math.sin(phi) * Math.sin(theta), Math.cos(phi));
    _upv.set(0, 0, 1).addScaledVector(_e, -_e.z);
    if (_upv.lengthSq() < 1e-9) _upv.set(0, 1, 0); else _upv.normalize();
    _rt.crossVectors(_upv, _e).normalize();
    var tanHalf = Math.tan(camera.fov * Math.PI / 360);
    var tanV = tanHalf, tanH = tanHalf * aspect, r = 1;
    for (var i = 0; i < CLOUD.length; i++) {
      var d = CLOUD[i], along = d.dot(_e);
      r = Math.max(r, along + Math.abs(d.dot(_upv)) / tanV,
                      along + Math.abs(d.dot(_rt)) / tanH);
    }
    radius = 1.2 * r;   // air for the two corner cards
    camera.far = 3 * radius;
    camera.updateProjectionMatrix();
  }

  function placeCamera() {
    computeRadius();
    camera.position.set(
      CENTER.x + radius * Math.sin(phi) * Math.cos(theta),
      CENTER.y + radius * Math.sin(phi) * Math.sin(theta),
      CENTER.z + radius * Math.cos(phi)
    );
    camera.lookAt(CENTER.x, CENTER.y, CENTER.z);
  }

  scene.add(new THREE.AmbientLight(0xffffff, 0.72));
  var key = new THREE.DirectionalLight(0xffffff, 0.5); key.position.set(5, 3, 6);
  var fill = new THREE.DirectionalLight(0x9fd8ff, 0.26); fill.position.set(-4, -5, 2);
  scene.add(key); scene.add(fill);

  // ---------- text sprites, in the book's serif ----------
  var LABELS = [];
  function paintLabel(rec) {
    var w = 256, h = 96, cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    var g = cv.getContext("2d");
    g.font = 'italic 50px "PT Serif", "Times New Roman", Times, serif';
    g.fillStyle = rec.colour;
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(rec.text, w / 2, h / 2);
    var tex = new THREE.CanvasTexture(cv);
    tex.minFilter = THREE.LinearFilter;
    if (rec.sprite.material.map) rec.sprite.material.map.dispose();
    rec.sprite.material.map = tex;
    rec.sprite.material.needsUpdate = true;
  }
  function makeLabel(text, colour, scale) {
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({
      transparent: true, depthTest: false, opacity: 0
    }));
    sp.scale.set(scale * 2.667, scale, 1);
    var rec = { text: text, colour: colour, sprite: sp };
    LABELS.push(rec); paintLabel(rec);
    return sp;
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { LABELS.forEach(paintLabel); });
  }

  // ---------- the dome ----------
  // Drawn over the ellipse x^2/4 + y^2/2 = 1, where f is still positive, so it
  // ends in a clean rim instead of falling out of the bottom of the picture.
  (function buildSurface() {
    var NR = 22, NT = 96, pos = [], idx = [], ir, it;
    for (ir = 0; ir <= NR; ir++) {
      var r = ir / NR;
      for (it = 0; it <= NT; it++) {
        var t = 2 * Math.PI * it / NT;
        var p = P3(XR * r * Math.cos(t), YR * r * Math.sin(t), 4 - 4 * r * r);
        pos.push(p.x, p.y, p.z);
      }
    }
    for (ir = 0; ir < NR; ir++) {
      for (it = 0; it < NT; it++) {
        var a = ir * (NT + 1) + it, b = a + 1, d = a + (NT + 1), e = d + 1;
        idx.push(a, d, b, b, d, e);
      }
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    scene.add(new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
      color: 0x2e7f96, transparent: true, opacity: 0.5,
      side: THREE.DoubleSide, shininess: 20, depthWrite: false
    })));

    var wp = [];
    for (ir = 2; ir <= NR; ir += 4) {
      var r2 = ir / NR;
      for (it = 0; it < NT; it++) {
        var t1 = 2 * Math.PI * it / NT, t2 = 2 * Math.PI * (it + 1) / NT;
        var p1 = P3(XR * r2 * Math.cos(t1), YR * r2 * Math.sin(t1), 4 - 4 * r2 * r2);
        var p2 = P3(XR * r2 * Math.cos(t2), YR * r2 * Math.sin(t2), 4 - 4 * r2 * r2);
        wp.push(p1.x, p1.y, p1.z, p2.x, p2.y, p2.z);
      }
    }
    for (it = 0; it < NT; it += 8) {
      var t3 = 2 * Math.PI * it / NT;
      for (ir = 0; ir < NR; ir++) {
        var ra = ir / NR, rb = (ir + 1) / NR;
        var q1 = P3(XR * ra * Math.cos(t3), YR * ra * Math.sin(t3), 4 - 4 * ra * ra);
        var q2 = P3(XR * rb * Math.cos(t3), YR * rb * Math.sin(t3), 4 - 4 * rb * rb);
        wp.push(q1.x, q1.y, q1.z, q2.x, q2.y, q2.z);
      }
    }
    var wgeo = new THREE.BufferGeometry();
    wgeo.setAttribute("position", new THREE.Float32BufferAttribute(wp, 3));
    scene.add(new THREE.LineSegments(wgeo, new THREE.LineBasicMaterial({
      color: 0x9fd8ff, transparent: true, opacity: 0.2
    })));
  })();

  // ---------- the floor, so the slices have something to stand on ----------
  (function buildFloor() {
    var g = [], n = 6, i;
    for (i = -n; i <= n; i++) {
      var u = XR * 1.15 * i / n, v = YR * 1.15 * i / n;
      g.push(-XR * 1.15, v, 0, XR * 1.15, v, 0);
      g.push(u, -YR * 1.15, 0, u, YR * 1.15, 0);
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(g, 3));
    scene.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
      color: 0x39404e, transparent: true, opacity: 0.5
    })));
  })();

  // ---------- rods, for the tangent lines and the drop line ----------
  var ROD = new THREE.CylinderGeometry(1, 1, 1, 12, 1, true);
  ROD.translate(0, 0.5, 0);
  var _yUp = new THREE.Vector3(0, 1, 0), _dir = new THREE.Vector3();
  function rod(from, to, r, colour, opacity) {
    var m = new THREE.Mesh(ROD, new THREE.MeshBasicMaterial({
      color: colour, transparent: true,
      opacity: opacity === undefined ? 1 : opacity
    }));
    _dir.subVectors(to, from);
    var len = _dir.length();
    m.position.copy(from);
    m.quaternion.setFromUnitVectors(_yUp, _dir.clone().normalize());
    m.scale.set(r, len, r);
    m.userData.len = len; m.userData.r = r;
    return m;
  }
  function setRodProgress(m, t) {
    m.scale.set(m.userData.r, Math.max(1e-4, m.userData.len * t), m.userData.r);
    m.visible = t > 0.002;
  }

  // ---------- P ----------
  var pDot = new THREE.Mesh(new THREE.SphereGeometry(0.062, 20, 14),
                            new THREE.MeshBasicMaterial({ color: INK }));
  pDot.position.copy(P3(X0, Y0, Z0));
  scene.add(pDot);
  scene.add(rod(P3(X0, Y0, 0), P3(X0, Y0, Z0), 0.008, 0xb8c0cc, 0.55));
  var pTag = makeLabel("P(1,1,1)", "#ece6e2", 0.34);
  pTag.position.copy(P3(X0 + 0.42, Y0 + 0.1, Z0 + 0.45));
  pTag.material.opacity = 0.95;
  scene.add(pTag);

  // ---------- one bundle per slice ----------
  var pickable = [];

  CUTS.forEach(function (C, i) {
    C.group = new THREE.Group();
    scene.add(C.group);

    // the cutting plane
    var quad;
    if (C.key === "y1") {
      quad = [P3(-XR, Y0, 0), P3(XR, Y0, 0), P3(XR, Y0, 4.2), P3(-XR, Y0, 4.2)];
    } else {
      quad = [P3(X0, -YR, 0), P3(X0, YR, 0), P3(X0, YR, 4.2), P3(X0, -YR, 4.2)];
    }
    var pg = new THREE.BufferGeometry().setFromPoints(
      [quad[0], quad[1], quad[2], quad[0], quad[2], quad[3]]);
    pg.computeVertexNormals();
    C.plane = new THREE.Mesh(pg, new THREE.MeshBasicMaterial({
      color: C.colour, transparent: true, opacity: 0.1,
      side: THREE.DoubleSide, depthWrite: false
    }));
    C.planeEdge = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(quad),
      new THREE.LineBasicMaterial({ color: C.colour, transparent: true, opacity: 0.4 }));
    C.plane.visible = C.planeEdge.visible = false;
    C.group.add(C.plane); C.group.add(C.planeEdge);

    // the parabola cut out of the dome, as a tube so it reads at a glance
    var pts = [];
    for (var k = 0; k <= 60; k++) {
      var t = -C.span + 2 * C.span * k / 60, q = C.curve(t);
      pts.push(P3(q[0], q[1], q[2] + 0.02));
    }
    C.traceGeo = new THREE.TubeGeometry(
      new THREE.CatmullRomCurve3(pts), 60, 0.035, 8, false);
    C.trace = new THREE.Mesh(C.traceGeo, new THREE.MeshBasicMaterial({ color: C.colour }));
    C.trace.visible = false;
    C.group.add(C.trace);
    C.traceCount = C.traceGeo.index.count;

    // the tangent line at P
    var d = C.dir, R = C.reach;
    var a = P3(X0 - R * d[0], Y0 - R * d[1], Z0 - R * d[2]),
        b = P3(X0 + R * d[0], Y0 + R * d[1], Z0 + R * d[2]);
    C.tangent = rod(a, b, 0.04, C.tan);
    C.tangent.visible = false;
    C.group.add(C.tangent);

    // labels: the curve on the dome, and the slope on the tangent
    C.traceTag = makeLabel(C.label, C.css, 0.3);
    var far = C.curve(-C.span * 0.86);
    C.traceTag.position.copy(P3(far[0], far[1], far[2] + 0.45));
    C.group.add(C.traceTag);

    // the two slope labels sit at opposite ends of their tangent lines, or the
    // steep one lands on top of the shallow one near the foot of the dome
    var end = i === 0 ? 1.02 : -1.02;
    C.slopeTag = makeLabel("slope " + C.slope, C.tanCss, 0.36);
    C.slopeTag.position.copy(P3(X0 + R * d[0] * end, Y0 + R * d[1] * end,
                                Z0 + R * d[2] * end + 0.42));
    C.group.add(C.slopeTag);

    // an invisible slab along the parabola, so the curve itself can be clicked
    C.hit = new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 30, 0.16, 6, false),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    C.hit.userData.cut = i;
    C.group.add(C.hit);
    pickable.push(C.hit);

    C.on = false;
    C.grow = 0;
  });

  // ---------- the legend ----------
  var rowsEl = document.getElementById("rows");

  function refreshReadout() {
    var chosen = CUTS.filter(function (C) { return C.on; });
    if (!chosen.length) {
      rowsEl.innerHTML = '<div class="empty">no slice chosen yet</div>';
      return;
    }
    rowsEl.innerHTML = chosen.map(function (C) {
      var d = C.key === "y1" ? "&#8706;f/&#8706;x" : "&#8706;f/&#8706;y";
      return '<div class="row">' +
             '<span class="swatch" style="background:' + C.tanCss + '"></span>' +
             '<span>' + d + ' at <i>P</i></span>' +
             '<span class="val" style="color:' + C.tanCss + '">' + C.slope + '</span></div>';
    }).join("");
  }

  function toggleCut(i, force) {
    var C = CUTS[i];
    var on = force === undefined ? !C.on : force;
    if (on === C.on) return;
    C.on = on;
    var btn = document.querySelectorAll(".cutBtn")[i];
    btn.classList.toggle("on", on);
    btn.style.background = on ? C.css : "";
    btn.style.borderColor = on ? C.css : "";
    refreshReadout();
  }

  document.querySelectorAll(".cutBtn").forEach(function (b) {
    b.addEventListener("click", function () { toggleCut(+b.dataset.i); });
  });
  document.getElementById("btnAll").addEventListener("click", function () {
    CUTS.forEach(function (C, i) { toggleCut(i, true); });
  });
  document.getElementById("btnClear").addEventListener("click", function () {
    CUTS.forEach(function (C, i) { toggleCut(i, false); });
  });

  // ---------- picking a parabola in the picture ----------
  var raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
  var dragging = false, dragged = false;

  function pick(e) {
    var b = canvas.getBoundingClientRect();
    pointer.x = ((e.clientX - b.left) / b.width) * 2 - 1;
    pointer.y = -((e.clientY - b.top) / b.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    var hits = raycaster.intersectObjects(pickable, false);
    return hits.length ? hits[0].object.userData.cut : -1;
  }

  canvas.addEventListener("pointermove", function (e) {
    if (dragging) return;
    canvas.classList.toggle("pick", pick(e) >= 0);
  });
  canvas.addEventListener("pointerleave", function () { canvas.classList.remove("pick"); });

  // ---------- drag to orbit ----------
  var lastX = 0, lastY = 0;
  canvas.addEventListener("pointerdown", function (e) {
    dragging = true; dragged = false; lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    if (Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY) > 2) dragged = true;
    targetPhi = targetTheta = null;
    theta -= (e.clientX - lastX) * 0.008;
    phi = Math.max(0.16, Math.min(Math.PI / 2 + 0.18, phi - (e.clientY - lastY) * 0.008));
    lastX = e.clientX; lastY = e.clientY;
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) {
    canvas.addEventListener(ev, function (e) {
      if (ev === "pointerup" && dragging && !dragged) {
        var i = pick(e);
        if (i >= 0) toggleCut(i);
      }
      dragging = false;
    });
  });

  // ---------- view buttons ----------
  // Looking along y puts the x-z plane on the screen, so C1 and its tangent are
  // seen in true shape; looking along x does the same for C2. Only one of the
  // two can be active at a time.
  var btnEyeY = document.getElementById("btnEyeY"),
      btnEyeX = document.getElementById("btnEyeX");

  function eye(btn, other, theta0) {
    btn.addEventListener("click", function () {
      var on = !btn.classList.contains("on");
      btn.classList.toggle("on", on);
      other.classList.remove("on");
      spinning = false;
      btnSpin.classList.remove("on");
      targetPhi = on ? Math.PI / 2 - 0.02 : 1.20;
      targetTheta = on ? theta0 : -0.98;
    });
  }

  var spinning = false, btnSpin = document.getElementById("btnSpin");
  eye(btnEyeY, btnEyeX, -Math.PI / 2);   // camera down the -y axis
  eye(btnEyeX, btnEyeY, 0);              // camera down the +x axis

  btnSpin.addEventListener("click", function () {
    spinning = !spinning;
    btnSpin.classList.toggle("on", spinning);
    if (spinning) {
      targetPhi = targetTheta = null;
      btnEyeY.classList.remove("on"); btnEyeX.classList.remove("on");
    }
  });
  document.getElementById("btnReset").addEventListener("click", function () {
    spinning = false;
    btnSpin.classList.remove("on");
    btnEyeY.classList.remove("on"); btnEyeX.classList.remove("on");
    targetPhi = 1.20; targetTheta = -0.98;
  });

  // ---------- resize / loop ----------
  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    aspect = w / h;
    camera.aspect = aspect;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);

  var clock = new THREE.Clock(), lastW = 0, lastH = 0;
  function tick() {
    var dt = Math.min(clock.getDelta(), 0.05);
    if (stage.clientWidth !== lastW || stage.clientHeight !== lastH) {
      lastW = stage.clientWidth; lastH = stage.clientHeight;
      resize();
    }

    CUTS.forEach(function (C) {
      var want = C.on ? 1 : 0;
      C.grow += (want - C.grow) * Math.min(1, dt * 2.8);
      if (Math.abs(want - C.grow) < 0.003) C.grow = want;

      C.plane.visible = C.planeEdge.visible = C.grow > 0.01;
      C.plane.material.opacity = 0.1 * C.grow;
      C.planeEdge.material.opacity = 0.4 * C.grow;

      // the parabola draws itself in from one end, the way Create() does
      C.trace.visible = C.grow > 0.02;
      C.traceGeo.setDrawRange(0, Math.max(6, Math.floor(C.traceCount * C.grow)));

      setRodProgress(C.tangent, Math.max(0, (C.grow - 0.55) / 0.45));
      C.traceTag.material.opacity = Math.max(0, (C.grow - 0.35) / 0.65);
      C.slopeTag.material.opacity = Math.max(0, (C.grow - 0.75) / 0.25);
    });

    if (targetPhi !== null) {
      phi += (targetPhi - phi) * Math.min(1, dt * 3.2);
      theta += (targetTheta - theta) * Math.min(1, dt * 3.2);
      if (Math.abs(targetPhi - phi) < 0.002 && Math.abs(targetTheta - theta) < 0.002) {
        phi = targetPhi; theta = targetTheta; targetPhi = targetTheta = null;
      }
    }
    if (spinning && !dragging) theta += 0.3 * dt;

    placeCamera();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  resize();
  refreshReadout();
  placeCamera();
  tick();
})();
</script>
</body>
</html>

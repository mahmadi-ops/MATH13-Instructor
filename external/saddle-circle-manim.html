<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Around the unit circle on the saddle z = xy -- animated</title>
<!-- The same two families the book itself loads (see pretext-html.xsl), so the
     figure's lettering matches the surrounding page rather than the reader's
     system UI font: Open Sans for text, PT Serif for the mathematics. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,300..800&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
  /* Manim-style palette: dark stage, saturated accents, light serif math.
     Kept in step with the book's other animated figures. */
  :root {
    --bg:        #06070a;
    --panel:     #101218;
    --edge:      #262a36;
    --ink:       #ece6e2;
    --dim:       #9aa0ad;
    --blue:      #58c4dd;
    --green:     #83c167;
    --yellow:    #ffe14d;
    --red:       #fc6255;
    --gold:      #f0ac5f;
    --sans:  "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif: "PT Serif", "Times New Roman", Times, serif;
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
               background: var(--bg); }
  body { font-family: var(--sans); color: var(--ink);
         -webkit-font-smoothing: antialiased; }
  #app { width: 100%; height: 100%; box-sizing: border-box;
         display: flex; flex-direction: column; }

  /* ---- stage ---- */
  #stage { position: relative; width: 100%; background: var(--bg);
           flex: 1 1 auto; min-height: 0; overflow: hidden; }
  /* the renderer is sized with updateStyle off, so the canvas has to be told
     to fill the stage in CSS -- otherwise it draws at its buffer size, which is
     devicePixelRatio times too big, and the picture overflows the frame. */
  #stage canvas { display: block; width: 100%; height: 100%;
                  cursor: grab; touch-action: none; }
  #stage canvas:active { cursor: grabbing; }
  #stage canvas.pick { cursor: pointer; }

  .overlay { position: absolute; pointer-events: none; }

  /* one legend, top-left: what is being traced, and the two numbers the
     chain rule is about. Nothing else is written over the stage. */
  #legend {
    top: 12px; left: 14px;
    padding: 9px 13px 10px 13px;
    background: rgba(16,18,24,0.72);
    border: 1px solid var(--edge);
    border-left: 3px solid var(--blue);
    border-radius: 6px;
    line-height: 1.5;
  }
  .math { font-family: var(--serif); font-size: 16px; }
  .math i { font-style: italic; }
  #legend .head { color: #9cdceb; }
  #rows { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--edge); }
  #rows .row {
    display: flex; align-items: baseline; gap: 8px;
    font-family: var(--serif); font-size: 15px; color: var(--ink);
  }
  #rows .row + .row { margin-top: 4px; }
  #rows .row .swatch {
    width: 16px; height: 3px; border-radius: 2px; flex: 0 0 auto;
    transform: translateY(-4px);
  }
  #rows .row .val {
    margin-left: auto; padding-left: 16px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  /* ---- control panel ---- */
  #panel {
    flex: 0 0 auto; border-top: 1px solid var(--edge);
    background: var(--panel); padding: 9px 12px 11px 12px; box-sizing: border-box;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .row + .row { margin-top: 9px; }
  .lbl { font-size: 13px; color: var(--dim); }

  button {
    font: inherit; font-size: 13.5px;
    padding: 5px 12px; border-radius: 999px;
    color: var(--ink); background: #1a1d26;
    border: 1px solid var(--edge);
    cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  }
  button:hover { background: #232734; }
  button .eq { font-family: var(--serif); font-style: italic; }
  /* an active path button wears its own colour, set from the palette in JS */
  button.on { color: #06070a; font-weight: 700; }
  #btnPlay.running, #btnSpin.on {
    background: var(--blue); border-color: var(--blue);
    color: #06070a; font-weight: 600;
  }

  .sliderRow { display: flex; align-items: center; gap: 10px; }
  .sliderRow .name {
    font-size: 14px; min-width: 92px;
    font-family: var(--serif);
    font-variant-numeric: tabular-nums;
  }
  input[type=range] {
    flex: 1; min-width: 120px; height: 22px;
    -webkit-appearance: none; appearance: none; background: transparent;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 2px; background: var(--edge);
  }
  input[type=range]::-moz-range-track {
    height: 3px; border-radius: 2px; background: var(--edge);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; margin-top: -5.5px;
    border-radius: 50%; background: var(--blue); border: none; cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border: none;
    border-radius: 50%; background: var(--blue); cursor: pointer;
  }

  @media (max-width: 620px) {
    #legend { padding: 7px 10px 8px 10px; top: 10px; left: 10px; }
    .math { font-size: 14px; }
    #rows .row { font-size: 13px; }
    .lbl { display: none; }
    button { font-size: 12.5px; padding: 4px 10px; }
  }
</style>
</head>

<body>
<div id="app">
  <div id="stage">
    <div id="legend" class="overlay">
      <div class="math head">
        <i>w</i> = <i>xy</i> on <i>x</i> = cos&#8202;<i>t</i>, <i>y</i> = sin&#8202;<i>t</i>
      </div>
      <div id="rows"></div>
    </div>

  </div>

  <div id="panel">
    <div class="row sliderRow">
      <span class="name"><i>t</i> = <span id="tVal">0.00</span></span>
      <input type="range" id="tSlider" min="0" max="6.2832" step="0.001" value="0"
             aria-label="the parameter t along the unit circle">
    </div>
    <div class="row">
      <span class="lbl">Jump to:</span>
      <button class="markBtn" data-t="0"><span class="eq">t</span> = 0</button>
      <button class="markBtn" data-t="0.7853981634"><span class="eq">t</span> = &#960;/4</button>
      <button class="markBtn" data-t="1.5707963268"><span class="eq">t</span> = &#960;/2</button>
      <span style="flex:1"></span>
      <button id="btnPlay">&#9654;&nbsp;Run</button>
      <button id="btnSpin">Spin</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  var BLUE_C = 0x58c4dd, GREEN_C = 0x83c167, GOLD_C = 0xf0ac5f,
      RED_C = 0xfc6255, PURPLE = 0xc074b6, INK = 0xece6e2;

  // ---------- the construction ----------
  // w(t) = cos t sin t = (1/2) sin 2t along the unit circle, so dw/dt = cos 2t.
  // The two are shown together: the height of the point on the saddle, and the
  // rate at which that height is changing.
  function w(t) { return Math.cos(t) * Math.sin(t); }
  function dw(t) { return Math.cos(2 * t); }

  var RS = 1.3;                 // the saddle is drawn over [-RS, RS]^2
  var ZK = 1.35;                // z is stretched: |xy| never exceeds 1/2
  var MARKS = [
    { t: 0,               colour: RED_C,   css: "#fc6255", tex: "t = 0" },
    { t: Math.PI / 4,     colour: GREEN_C, css: "#83c167", tex: "t = pi/4" },
    { t: Math.PI / 2,     colour: BLUE_C,  css: "#58c4dd", tex: "t = pi/2" }
  ];

  // ---------- renderer / scene ----------
  var stage = document.getElementById("stage");
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.appendChild(renderer.domElement);
  var canvas = renderer.domElement;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x06070a);

  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
  camera.up.set(0, 0, 1);

  function P3(x, y, z) { return new THREE.Vector3(x, y, ZK * z); }

  var CENTER = P3(0, 0, 0.1);
  var radius = 7, theta = -0.98, phi = 1.14, aspect = 1;
  var targetPhi = null, targetTheta = null;

  var CLOUD = (function () {
    var pts = [], k, t;
    for (k = 0; k < 16; k++) {
      t = 2 * Math.PI * k / 16;
      var cx = RS * 1.1 * Math.cos(t), cy = RS * 1.1 * Math.sin(t);
      pts.push(P3(cx, cy, cx * cy));
      pts.push(P3(cx, cy, 0));
    }
    return pts.map(function (p) { return p.sub(CENTER); });
  })();

  var _e = new THREE.Vector3(), _upv = new THREE.Vector3(), _rt = new THREE.Vector3();
  function computeRadius() {
    _e.set(Math.sin(phi) * Math.cos(theta), Math.sin(phi) * Math.sin(theta), Math.cos(phi));
    _upv.set(0, 0, 1).addScaledVector(_e, -_e.z);
    if (_upv.lengthSq() < 1e-9) _upv.set(0, 1, 0); else _upv.normalize();
    _rt.crossVectors(_upv, _e).normalize();
    var tanHalf = Math.tan(camera.fov * Math.PI / 360);
    var tanV = tanHalf, tanH = tanHalf * aspect, r = 1;
    for (var i = 0; i < CLOUD.length; i++) {
      var d = CLOUD[i], along = d.dot(_e);
      r = Math.max(r, along + Math.abs(d.dot(_upv)) / tanV,
                      along + Math.abs(d.dot(_rt)) / tanH);
    }
    radius = 1.06 * r;
    camera.far = 3 * radius;
    camera.updateProjectionMatrix();
  }

  function placeCamera() {
    computeRadius();
    camera.position.set(
      CENTER.x + radius * Math.sin(phi) * Math.cos(theta),
      CENTER.y + radius * Math.sin(phi) * Math.sin(theta),
      CENTER.z + radius * Math.cos(phi)
    );
    camera.lookAt(CENTER.x, CENTER.y, CENTER.z);
  }

  scene.add(new THREE.AmbientLight(0xffffff, 0.74));
  var key = new THREE.DirectionalLight(0xffffff, 0.5); key.position.set(5, 3, 6);
  var fill = new THREE.DirectionalLight(0x9fd8ff, 0.26); fill.position.set(-4, -5, 2);
  scene.add(key); scene.add(fill);

  // ---------- text sprites ----------
  // The canvas is cut to the text rather than being a fixed 256x96 box, so a
  // short label is not padded down to nothing: `height` is the sprite's height
  // in world units and the width follows from the type. Drawn large enough to
  // be read at the size the figure is embedded at.
  var LABELS = [], LABEL_PX = 96;
  function paintLabel(rec) {
    var cv = rec.canvas || (rec.canvas = document.createElement("canvas"));
    var font = 'italic ' + LABEL_PX + 'px "PT Serif", "Times New Roman", Times, serif';
    var g = cv.getContext("2d");
    g.font = font;
    var wpx = Math.ceil(g.measureText(rec.text).width) + 20,
        hpx = Math.ceil(LABEL_PX * 1.4);
    cv.width = wpx; cv.height = hpx;
    g = cv.getContext("2d");                       // resizing clears the state
    g.font = font;
    g.fillStyle = rec.colour;
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(rec.text, wpx / 2, hpx / 2);
    var tex = new THREE.CanvasTexture(cv);
    tex.minFilter = THREE.LinearFilter;
    if (rec.sprite.material.map) rec.sprite.material.map.dispose();
    rec.sprite.material.map = tex;
    rec.sprite.material.needsUpdate = true;
    rec.sprite.scale.set(rec.height * wpx / hpx, rec.height, 1);
  }
  function makeLabel(text, colour, height, opacity) {
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({
      transparent: true, depthTest: false,
      opacity: opacity === undefined ? 1 : opacity
    }));
    var rec = { text: text, colour: colour, height: height, sprite: sp };
    LABELS.push(rec); paintLabel(rec);
    return sp;
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { LABELS.forEach(paintLabel); });
  }

  // ---------- the saddle z = xy ----------
  // Coloured by height, blue where xy is negative and gold where it is positive,
  // so the two rising and two falling quarters of the trip read apart.
  (function buildSurface() {
    var NR = 26, NT = 96, pos = [], col = [], idx = [], ir, it;
    var lo = new THREE.Color(BLUE_C), mid = new THREE.Color(0x39404e),
        hi = new THREE.Color(GOLD_C), c = new THREE.Color();
    for (ir = 0; ir <= NR; ir++) {
      var r = RS * ir / NR;
      for (it = 0; it <= NT; it++) {
        var t = 2 * Math.PI * it / NT;
        var x = r * Math.cos(t), y = r * Math.sin(t), z = x * y;
        var p = P3(x, y, z);
        pos.push(p.x, p.y, p.z);
        var u = (z / (RS * RS / 2) + 1) / 2;
        if (u < 0.5) c.copy(lo).lerp(mid, Math.max(0, u) / 0.5);
        else c.copy(mid).lerp(hi, Math.min(1, (u - 0.5) / 0.5));
        col.push(c.r, c.g, c.b);
      }
    }
    for (ir = 0; ir < NR; ir++) {
      for (it = 0; it < NT; it++) {
        var a = ir * (NT + 1) + it, b = a + 1, d = a + (NT + 1), e = d + 1;
        idx.push(a, d, b, b, d, e);
      }
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    scene.add(new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
      vertexColors: true, transparent: true, opacity: 0.62,
      side: THREE.DoubleSide, shininess: 18, depthWrite: false
    })));

    var wp = [], k;
    for (ir = 4; ir <= NR; ir += 6) {
      var r2 = RS * ir / NR;
      for (it = 0; it < NT; it++) {
        var t1 = 2 * Math.PI * it / NT, t2 = 2 * Math.PI * (it + 1) / NT;
        var p1 = P3(r2 * Math.cos(t1), r2 * Math.sin(t1),
                    r2 * r2 * Math.cos(t1) * Math.sin(t1));
        var p2 = P3(r2 * Math.cos(t2), r2 * Math.sin(t2),
                    r2 * r2 * Math.cos(t2) * Math.sin(t2));
        wp.push(p1.x, p1.y, p1.z, p2.x, p2.y, p2.z);
      }
    }
    for (it = 0; it < NT; it += 8) {
      var t3 = 2 * Math.PI * it / NT;
      for (k = 0; k < NR; k++) {
        var ra = RS * k / NR, rb = RS * (k + 1) / NR;
        var q1 = P3(ra * Math.cos(t3), ra * Math.sin(t3),
                    ra * ra * Math.cos(t3) * Math.sin(t3));
        var q2 = P3(rb * Math.cos(t3), rb * Math.sin(t3),
                    rb * rb * Math.cos(t3) * Math.sin(t3));
        wp.push(q1.x, q1.y, q1.z, q2.x, q2.y, q2.z);
      }
    }
    var wgeo = new THREE.BufferGeometry();
    wgeo.setAttribute("position", new THREE.Float32BufferAttribute(wp, 3));
    scene.add(new THREE.LineSegments(wgeo, new THREE.LineBasicMaterial({
      color: 0x9fd8ff, transparent: true, opacity: 0.16
    })));
  })();

  // ---------- the unit circle, and the curve it lifts to ----------
  function ringPoints(lift) {
    var pts = [], k;
    for (k = 0; k <= 160; k++) {
      var t = 2 * Math.PI * k / 160;
      pts.push(P3(Math.cos(t), Math.sin(t), lift ? w(t) : 0));
    }
    return pts;
  }
  var circle = new THREE.Mesh(
    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(ringPoints(false), true),
                           200, 0.022, 8, true),
    new THREE.MeshBasicMaterial({ color: PURPLE }));
  scene.add(circle);
  var circleTag = makeLabel("x\u00b2 + y\u00b2 = 1", "#c074b6", 0.42, 1);
  circleTag.position.copy(P3(-0.86, -0.86, -0.88));
  scene.add(circleTag);

  var trail = new THREE.Mesh(
    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(ringPoints(true), true),
                           240, 0.034, 8, true),
    new THREE.MeshBasicMaterial({ color: GREEN_C }));
  scene.add(trail);
  var trailCount = trail.geometry.index.count;
  var trailTag = makeLabel("z = xy", "#b8c0cc", 0.42, 1);
  trailTag.position.copy(P3(0.95, 0.95, 0.95 * 0.95 + 0.16));
  scene.add(trailTag);

  // ---------- the three marked points of the static figure ----------
  MARKS.forEach(function (M) {
    var dot = new THREE.Mesh(new THREE.SphereGeometry(0.05, 18, 12),
                             new THREE.MeshBasicMaterial({ color: M.colour }));
    dot.position.copy(P3(Math.cos(M.t), Math.sin(M.t), w(M.t)));
    scene.add(dot);
  });

  // ---------- the moving point, its shadow and its tangent direction ----------
  var walker = new THREE.Mesh(new THREE.SphereGeometry(0.075, 20, 14),
                              new THREE.MeshBasicMaterial({ color: INK }));
  var shadow = new THREE.Mesh(new THREE.SphereGeometry(0.055, 18, 12),
                              new THREE.MeshBasicMaterial({ color: PURPLE }));
  scene.add(walker); scene.add(shadow);

  var dropGeo = new THREE.BufferGeometry().setFromPoints([P3(1, 0, 0), P3(1, 0, 0)]);
  var drop = new THREE.Line(dropGeo, new THREE.LineDashedMaterial({
    color: 0xb8c0cc, dashSize: 0.07, gapSize: 0.05, transparent: true, opacity: 0.8 }));
  scene.add(drop);

  // an arrow along the curve, whose length is |dw/dt|: the rate itself, drawn
  var rateArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0),
                                        new THREE.Vector3(), 0.5, GOLD_C, 0.14, 0.09);
  scene.add(rateArrow);

  // ---------- the legend ----------
  var rowsEl = document.getElementById("rows"),
      tValEl = document.getElementById("tVal"),
      slider = document.getElementById("tSlider");

  function fmt(v) {
    if (Math.abs(v) < 0.005) v = 0;          // no "-0.00" in the readout
    return (v < 0 ? "\u2212" : "") + Math.abs(v).toFixed(2);
  }

  function refresh(t) {
    var x = Math.cos(t), y = Math.sin(t), ww = w(t), rate = dw(t);
    tValEl.textContent = t.toFixed(2);

    walker.position.copy(P3(x, y, ww));
    shadow.position.copy(P3(x, y, 0));
    dropGeo.setFromPoints([P3(x, y, 0), P3(x, y, ww)]);
    drop.computeLineDistances();

    // the tangent to the lifted curve, scaled so the arrow *is* the rate
    var d = new THREE.Vector3(-Math.sin(t), Math.cos(t), ZK * rate);
    var len = 0.28 + 0.62 * Math.abs(rate);
    rateArrow.position.copy(P3(x, y, ww));
    rateArrow.setDirection(d.normalize());
    rateArrow.setLength(len, 0.16 * len + 0.05, 0.5 * (0.16 * len + 0.05));
    rateArrow.setColor(new THREE.Color(rate >= 0 ? GOLD_C : RED_C));

    rowsEl.innerHTML =
      '<div class="row"><span class="swatch" style="background:#ece6e2"></span>' +
      '<span>w = &#189; sin 2t</span><span class="val">' + fmt(ww) + '</span></div>' +
      '<div class="row"><span class="swatch" style="background:' +
      (rate >= 0 ? "#f0ac5f" : "#fc6255") + '"></span>' +
      '<span>dw/dt = cos 2t</span><span class="val" style="color:' +
      (rate >= 0 ? "#f0ac5f" : "#fc6255") + '">' + fmt(rate) + '</span></div>';

    // the trail is drawn only as far as the point has travelled
    trail.geometry.setDrawRange(0, Math.max(6, Math.floor(trailCount * t / (2 * Math.PI))));
  }

  slider.addEventListener("input", function () {
    playing = false;
    document.getElementById("btnPlay").classList.remove("running");
    refresh(parseFloat(slider.value));
  });

  document.querySelectorAll(".markBtn").forEach(function (b) {
    b.addEventListener("click", function () {
      playing = false;
      document.getElementById("btnPlay").classList.remove("running");
      var t = parseFloat(b.dataset.t);
      slider.value = String(t);
      refresh(t);
    });
  });

  var playing = false, btnPlay = document.getElementById("btnPlay");
  btnPlay.addEventListener("click", function () {
    playing = !playing;
    btnPlay.classList.toggle("running", playing);
  });

  var spinning = false, btnSpin = document.getElementById("btnSpin");
  btnSpin.addEventListener("click", function () {
    spinning = !spinning;
    btnSpin.classList.toggle("on", spinning);
  });

  // ---------- drag to orbit ----------
  var dragging = false, lastX = 0, lastY = 0;
  canvas.addEventListener("pointerdown", function (e) {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    theta -= (e.clientX - lastX) * 0.008;
    phi = Math.max(0.16, Math.min(Math.PI / 2 + 0.3, phi - (e.clientY - lastY) * 0.008));
    lastX = e.clientX; lastY = e.clientY;
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) {
    canvas.addEventListener(ev, function () { dragging = false; });
  });

  // ---------- resize / loop ----------
  function resize() {
    var wpx = stage.clientWidth, h = stage.clientHeight;
    if (!wpx || !h) return;
    renderer.setSize(wpx, h, false);
    aspect = wpx / h;
    camera.aspect = aspect;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);

  var clock = new THREE.Clock(), lastW = 0, lastH = 0;
  function tick() {
    var dt = Math.min(clock.getDelta(), 0.05);
    if (stage.clientWidth !== lastW || stage.clientHeight !== lastH) {
      lastW = stage.clientWidth; lastH = stage.clientHeight;
      resize();
    }
    if (playing) {
      var t = parseFloat(slider.value) + 0.75 * dt;
      if (t > 2 * Math.PI) t -= 2 * Math.PI;
      slider.value = String(t);
      refresh(t);
    }
    if (spinning && !dragging) theta += 0.3 * dt;
    placeCamera();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  resize();
  refresh(0);
  placeCamera();
  tick();
})();
</script>
</body>
</html>

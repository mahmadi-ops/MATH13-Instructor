<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The directional derivative as a limit of secant slopes on z = 1 + x^2 + y^2</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { width: 100%; box-sizing: border-box; }
  #controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 8px 10px; box-sizing: border-box;
  }
  button {
    font-size: 14px; padding: 5px 12px; border-radius: 6px;
    border: 1px solid #888; background: #f4f4f4; cursor: pointer;
  }
  button:hover { background: #e6e6e6; }
  button.active { background: #2a6fdb; color: #fff; border-color: #2a6fdb; }
  #playBtn { min-width: 92px; }
  #sliderRow {
    display: flex; align-items: center; gap: 10px;
    padding: 0 10px 6px 10px; box-sizing: border-box;
  }
  #sSlider { flex: 1; }
  #sLabel { font-size: 15px; min-width: 78px; font-variant-numeric: tabular-nums; }
  #readout { font-size: 14px; color: #333; padding: 0 10px 6px 10px; min-height: 1.2em;
    font-variant-numeric: tabular-nums; }
  #canvasWrap { width: 100%; position: relative; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<div id="app">
  <div id="controls">
    <span style="font-size:14px;">u = &lang;1/&radic;2, 1/&radic;2&rang; at P&#8320;(1,1):</span>
    <button id="limitBtn" title="Animate the limit">&#9654; s &rarr; 0</button>
    <span style="flex:1"></span>
    <button id="playBtn" title="Toggle automatic rotation">&#9654; Rotate</button>
  </div>
  <div id="sliderRow">
    <span id="sLabel">s = 1.20</span>
    <input type="range" id="sSlider" min="0.05" max="1.5" step="0.01" value="1.2">
  </div>
  <div id="readout"></div>
  <div id="canvasWrap"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  // ---------- renderer / scene ----------
  var wrap = document.getElementById("canvasWrap");
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  wrap.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);

  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  camera.up.set(0, 0, 1); // z points up, math convention

  var radius = 8.6, theta = 0.55, phiCam = 1.15;
  function placeCamera() {
    camera.position.set(
      radius * Math.sin(phiCam) * Math.cos(theta),
      radius * Math.sin(phiCam) * Math.sin(theta),
      radius * Math.cos(phiCam) + 1.6
    );
    camera.lookAt(0, 0, 1.6);
  }

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  var dir1 = new THREE.DirectionalLight(0xffffff, 0.7);
  dir1.position.set(5, 3, 6);
  scene.add(dir1);
  var dir2 = new THREE.DirectionalLight(0xffffff, 0.35);
  dir2.position.set(-4, -5, -3);
  scene.add(dir2);

  var RMAX = 1.8; // radius of the surface patch
  var C = 1 / Math.sqrt(2); // u = (C, C)
  var R2 = 2 * Math.sqrt(2);

  // ---------- axes ----------
  function axis(from, to, color) {
    var g = new THREE.BufferGeometry().setFromPoints([from, to]);
    scene.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: color })));
  }
  var A = 2.8;
  axis(new THREE.Vector3(-A, 0, 0), new THREE.Vector3(A, 0, 0), 0x999999);
  axis(new THREE.Vector3(0, -A, 0), new THREE.Vector3(0, A, 0), 0x999999);
  axis(new THREE.Vector3(0, 0, -0.4), new THREE.Vector3(0, 0, 5.0), 0x999999);

  function f(x, y) { return 1 + x * x + y * y; }

  // ---------- surface z = 1 + x^2 + y^2 ----------
  (function buildSurface() {
    var nu = 96, nv = 36; // around, radial
    var positions = [], indices = [];
    for (var j = 0; j <= nv; j++) {
      var r = (RMAX * j) / nv;
      for (var i = 0; i <= nu; i++) {
        var t = (2 * Math.PI * i) / nu;
        positions.push(r * Math.cos(t), r * Math.sin(t), 1 + r * r);
      }
    }
    for (var jj = 0; jj < nv; jj++) {
      for (var ii = 0; ii < nu; ii++) {
        var a = jj * (nu + 1) + ii, b = a + 1;
        var c = a + (nu + 1), d = c + 1;
        indices.push(a, b, d, a, d, c);
      }
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    var mat = new THREE.MeshPhongMaterial({
      color: 0x4f8fd6, transparent: true, opacity: 0.45,
      side: THREE.DoubleSide, depthWrite: false, shininess: 60
    });
    scene.add(new THREE.Mesh(geo, mat));
    var wire = new THREE.LineSegments(
      new THREE.WireframeGeometry(geo),
      new THREE.LineBasicMaterial({ color: 0x35659a, transparent: true, opacity: 0.12 })
    );
    scene.add(wire);
  })();

  // ---------- vertical plane x - y = 0 (contains u) ----------
  var planeMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(6.4, 4.6),
    new THREE.MeshPhongMaterial({
      color: 0xf2c14e, transparent: true, opacity: 0.30,
      side: THREE.DoubleSide, depthWrite: false
    })
  );
  planeMesh.rotation.order = "ZXY";
  planeMesh.rotation.x = Math.PI / 2;
  planeMesh.rotation.z = Math.PI / 4;
  planeMesh.position.set(1, 1, 2.1);
  scene.add(planeMesh);

  // ---------- trace curve z = 1 + 2t^2 along x = y (fixed) ----------
  (function () {
    var pts = [], M = 160;
    for (var i = 0; i <= M; i++) {
      var t = -3.7 + (7.4 * i) / M;
      var x = 1 + t * C, y = 1 + t * C;
      if (x * x + y * y <= RMAX * RMAX) {
        pts.push(new THREE.Vector3(x, y, f(x, y)));
      }
    }
    var curve = new THREE.CatmullRomCurve3(pts);
    var geo = new THREE.TubeGeometry(curve, 200, 0.035, 8, false);
    scene.add(new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ color: 0xd1362f })));
  })();

  // ---------- tangent line at (1,1,3) (dashed, the target of the limit) ----------
  (function () {
    var dirv = new THREE.Vector3(C, C, R2).normalize();
    var p0 = new THREE.Vector3(1, 1, 3);
    var g = new THREE.BufferGeometry().setFromPoints([
      p0.clone().addScaledVector(dirv, -1.3),
      p0.clone().addScaledVector(dirv, 1.3)]);
    var l = new THREE.Line(g, new THREE.LineDashedMaterial({
      color: 0x009e73, dashSize: 0.12, gapSize: 0.08 }));
    l.computeLineDistances();
    scene.add(l);
  })();

  // ---------- u arrow at (1,1,0) ----------
  scene.add(new THREE.ArrowHelper(
    new THREE.Vector3(C, C, 0),
    new THREE.Vector3(1, 1, 0.01), 0.9, 0x2a6fdb, 0.24, 0.14));

  // ---------- fixed point (1,1,3) and base point (1,1,0) ----------
  var ptMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
  var p0Surf = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 16), ptMat);
  p0Surf.position.set(1, 1, 3);
  scene.add(p0Surf);
  var p0Base = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 16), ptMat);
  p0Base.position.set(1, 1, 0);
  scene.add(p0Base);

  // ---------- movable pieces: point P, secant line, drop lines ----------
  var movGroup = new THREE.Group();
  scene.add(movGroup);
  var redMat = new THREE.MeshPhongMaterial({ color: 0xd1362f });
  var secMat = new THREE.MeshPhongMaterial({ color: 0x009e73 });

  function clearMov() {
    while (movGroup.children.length) {
      var m = movGroup.children.pop();
      if (m.geometry) m.geometry.dispose();
    }
  }
  function dashedLine(a, b) {
    var g = new THREE.BufferGeometry().setFromPoints([a, b]);
    var l = new THREE.Line(g, new THREE.LineDashedMaterial({
      color: 0x777777, dashSize: 0.12, gapSize: 0.08 }));
    l.computeLineDistances();
    movGroup.add(l);
  }

  var sVal = 1.2;

  function updateS() {
    clearMov();
    var qx = 1 + sVal * C, qy = 1 + sVal * C;
    var Q = new THREE.Vector3(qx, qy, f(qx, qy));
    var P0 = new THREE.Vector3(1, 1, 3);

    // moving point on the surface and its base point
    var qs = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 16), redMat);
    qs.position.copy(Q); movGroup.add(qs);
    var qb = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 16), redMat);
    qb.position.set(qx, qy, 0); movGroup.add(qb);

    // vertical dashed drop lines
    dashedLine(new THREE.Vector3(1, 1, 0), P0);
    dashedLine(new THREE.Vector3(qx, qy, 0), Q);

    // secant line through P0 and Q, extended both ways
    var dirv = Q.clone().sub(P0).normalize();
    var a = P0.clone().addScaledVector(dirv, -0.9);
    var b = Q.clone().addScaledVector(dirv, 0.9);
    var curve = new THREE.CatmullRomCurve3([a, b]);
    movGroup.add(new THREE.Mesh(
      new THREE.TubeGeometry(curve, 32, 0.04, 8, false), secMat));

    // readout
    var slope = R2 + sVal; // (f(Q) - f(P0)) / s = 2*sqrt(2) + s
    document.getElementById("readout").textContent =
      "s = " + sVal.toFixed(2) +
      ":   secant slope = ( f(P) − f(P₀) ) / s = 2√2 + s = " + slope.toFixed(3) +
      "   →   tangent slope = 2√2 ≈ " + R2.toFixed(3);
    render();
  }

  // ---------- rendering / animation (starts PAUSED) ----------
  var playing = false;
  var rafId = null;

  function render() { renderer.render(scene, camera); }

  function animate() {
    if (!playing) return;
    theta += 0.006;
    placeCamera();
    render();
    rafId = requestAnimationFrame(animate);
  }

  var playBtn = document.getElementById("playBtn");
  playBtn.addEventListener("click", function () {
    playing = !playing;
    playBtn.innerHTML = playing ? "&#10074;&#10074; Pause" : "&#9654; Rotate";
    playBtn.classList.toggle("active", playing);
    if (playing) animate();
    else if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
  });

  // ---------- s -> 0 limit animation ----------
  var slider = document.getElementById("sSlider");
  var limId = null;
  var limitBtn = document.getElementById("limitBtn");
  function stopLimit() {
    if (limId !== null) { cancelAnimationFrame(limId); limId = null; }
    limitBtn.classList.remove("active");
  }
  function limitStep() {
    sVal = Math.max(0.05, sVal - 0.012);
    slider.value = sVal;
    document.getElementById("sLabel").textContent = "s = " + sVal.toFixed(2);
    updateS();
    if (sVal > 0.05) limId = requestAnimationFrame(limitStep);
    else stopLimit();
  }
  limitBtn.addEventListener("click", function () {
    stopLimit();
    if (sVal <= 0.06) sVal = 1.5; // restart from the right
    limitBtn.classList.add("active");
    limId = requestAnimationFrame(limitStep);
  });

  slider.addEventListener("input", function () {
    stopLimit();
    sVal = parseFloat(slider.value);
    document.getElementById("sLabel").textContent = "s = " + sVal.toFixed(2);
    updateS();
  });

  // ---------- drag to rotate ----------
  var dragging = false, lastX = 0, lastY = 0;
  var el = renderer.domElement;
  function startDrag(x, y) { dragging = true; lastX = x; lastY = y; }
  function moveDrag(x, y) {
    if (!dragging) return;
    theta -= (x - lastX) * 0.008;
    phiCam = Math.min(Math.PI - 0.05, Math.max(0.05, phiCam - (y - lastY) * 0.008));
    lastX = x; lastY = y;
    placeCamera();
    if (!playing) render();
  }
  el.addEventListener("mousedown", function (e) { startDrag(e.clientX, e.clientY); });
  window.addEventListener("mousemove", function (e) { moveDrag(e.clientX, e.clientY); });
  window.addEventListener("mouseup", function () { dragging = false; });
  el.addEventListener("touchstart", function (e) {
    if (e.touches.length === 1) { startDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
  }, { passive: false });
  el.addEventListener("touchmove", function (e) {
    if (e.touches.length === 1) { moveDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
  }, { passive: false });
  window.addEventListener("touchend", function () { dragging = false; });

  // ---------- sizing (fills iframe) ----------
  function resize() {
    var w = document.getElementById("app").clientWidth;
    var used = document.getElementById("controls").offsetHeight +
               document.getElementById("sliderRow").offsetHeight +
               document.getElementById("readout").offsetHeight;
    var h = Math.max(220, window.innerHeight - used - 4);
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    render();
  }
  window.addEventListener("resize", resize);

  // ---------- initial state: paused, s = 1.2 ----------
  placeCamera();
  resize();
  updateS();
})();
</script>
</body>
</html>

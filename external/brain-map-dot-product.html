<script>
// Every node links to the place in the book where the topic lives.  The hrefs

const NODES = [
 {
  "id": "dot",
  "x": 545,

 },
 {

  "w": 400,

  "m": [
   [
    "\\lVert\\mathbf u-\\mathbf v\\rVert^2=\\lVert\\mathbf u\\rVert^2+\\lVert\\mathbf v\\rVert^2-2\\lVert\\mathbf u\\rVert\\lVert\\mathbf v\\rVert\\cos\\theta",

   ]

  "href": "../sec-dot-product.html#fig-law-of-cosines",
  "figHtml": "<svg width=\"330\" height=\"170\" viewBox=\"0 0 330 170\" aria-hidden=\"true\"><defs><marker id=\"lc-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"rgba(243,242,242,0.85)\"/></marker><marker id=\"lc-g\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#cf9f55\"/></marker></defs><line x1=\"25\" y1=\"150\" x2=\"270\" y2=\"150\" stroke=\"rgba(243,242,242,0.85)\" stroke-width=\"2\" marker-end=\"url(#lc-a)\"/><line x1=\"25\" y1=\"150\" x2=\"165\" y2=\"30\" stroke=\"rgba(243,242,242,0.85)\" stroke-width=\"2\" marker-end=\"url(#lc-a)\"/><line x1=\"270\" y1=\"150\" x2=\"170\" y2=\"34\" stroke=\"#cf9f55\" stroke-width=\"2\" stroke-dasharray=\"6 5\" marker-end=\"Gurl(#lc-a)\"/><path d=\"M70,150 A45,45 0 0,0 59,121\" fill=\"none\" stroke=\"rgba(243,242,242,0.45)\" stroke-width=\"1.5\"/><text x=\"80\" y=\"137\" fill=\"rgba(243,242,242,0.85)\" font-size=\"15\" text-anchor=\"middle\" style=\"font-family:Lora,Georgia,serif;font-style:italic;\">θ</text><text x=\"80\" y=\"82\" fill=\"rgba(243,242,242,0.85)\" font-size=\"17\" text-anchor=\"middle\" style=\"font-family:Lora,Georgia,serif;font-style:italic;font-weight:700;\">u</text><text x=\"150\" y=\"168\" fill=\"rgba(243,242,242,0.85)\" font-size=\"17\" text-anchor=\"middle\" style=\"font-family:Lora,Georgia,serif;font-style:italic;font-weight:700;\">v</text><text x=\"250\" y=\"85\" fill=\"#cf9f55\" font-size=\"15\" text-anchor=\"middle\" style=\"font-family:Lora,Georgia,serif;font-style:italic;font-weight:700;\">w = u − v</text></svg>"
 },
 {
  "id": "def",
  "x": 500,

   ]

 },
 {

 },

  "href": "../sec-dot-product.html#remark-orthogonal",
  "figHtml": "<svg width=\"150\" height=\"90\" viewBox=\"0 0 150 90\" aria-hidden=\"true\"><defs><marker id=\"or-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"rgba(243,242,242,0.85)\"/></marker><marker id=\"or-g\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#cf9f55\"/></marker></defs><line x1=\"20\" y1=\"75\" x2=\"135\" y2=\"75\" stroke=\"rgba(243,242,242,0.85)\" stroke-width=\"2\" marker-end=\"url(#or-a)\"/><line x1=\"20\" y1=\"75\" x2=\"20\" y2=\"12\" stroke=\"rgba(243,242,242,0.85)\" stroke-width=\"2\" marker-end=\"url(#or-a)\"/><path d=\"M20,61 L34,61 L34,75\" fill=\"none\" stroke=\"rgba(243,242,242,0.45)\" stroke-width=\"1.5\"/><text x=\"110\" y=\"66\" fill=\"rgba(243,242,242,0.85)\" font-size=\"17\" text-anchor=\"middle\" style=\"font-family:Lora,Georgia,serif;font-style:italic;font-weight:700;\">v</text><text x=\"36\" y=\"24\" fill=\"rgba(243,242,242,0.85)\" font-size=\"17\" text-anchor=\"middle\" style=\"font-family:Lora,Georgia,serif;font-style:italic;font-weight:700;\">u</text></svg>"
 },
 {
  "id": "props",
  "x": 60,
  "y": 760,
  "w": 400,
  "t": "Properties",
  "m": [
   [
    "\\mathbf u\\cdot\\mathbf v=\\mathbf v\\cdot\\mathbf u,\\qquad \\mathbf 0\\cdot\\mathbf u=0",
    15.5
   ],
   [
    "(c\\mathbf u)\\cdot\\mathbf v=\\mathbf u\\cdot(c\\mathbf v)=c(\\mathbf u\\cdot\\mathbf v)",
    15.5
   ],
   [
    "\\mathbf u\\cdot(\\mathbf v+\\mathbf w)=\\mathbf u\\cdot\\mathbf v+\\mathbf u\\cdot\\mathbf w",
    15.5
   ],
   [
    "\\mathbf u\\cdot\\mathbf u=\\lVert\\mathbf u\\rVert^2",
    15.5
   ]
  ],
  "href": "../sec-dot-product.html#par-properties"
 },
 {
  "id": "proj",
  "x": 1050,
  "y": 470,
  "w": 210,
  "hub": "Projection",
  "hubSize": 32,
  "gold": true,
  "rule": true,
  "href": "../sec-projection.html"
 },
 {
  "id": "projfig",
  "x": 1010,
  "y": 60,
  "w": 400,
  "t": "The shadow of u on v",
  "href": "../sec-projection.html#fig-projection",
  "figHtml": "<svg width=\"350\" height=\"200\" viewBox=\"0 0 350 200\" aria-hidden=\"true\"><defs><marker id=\"pj-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"rgba(243,242,242,0.85)\"/></marker><marker id=\"pj-g\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#cf9f55\"/></marker></defs><line x1=\"20\" y1=\"175\" x2=\"330\" y2=\"175\" stroke=\"rgba(243,242,242,0.85)\" stroke-width=\"2\" marker-end=\"url(#pj-a)\"/><line x1=\"20\" y1=\"175\" x2=\"200\" y2=\"35\" stroke=\"rgba(243,242,242,0.85)\" stroke-width=\"2\" marker-end=\"url(#pj-a)\"/><line x1=\"20\" y1=\"175\" x2=\"198\" y2=\"175\" stroke=\"#cf9f55\" stroke-width=\"4\" marker-end=\"Gurl(#pj-a)\"/><line x1=\"200\" y1=\"173\" x2=\"200\" y2=\"40\" stroke=\"#cf9f55\" stroke-width=\"2.5\" stroke-dasharray=\"6 5\"/><path d=\"M186,175 L186,161 L200,161\" fill=\"none\" stroke=\"rgba(243,242,242,0.45)\" stroke-width=\"1.5\"/><path d=\"M68,175 A48,48 0 0,0 58,145\" fill=\"none\" stroke=\"rgba(243,242,242,0.45)\" stroke-width=\"1.5\"/><text x=\"78\" y=\"163\" fill=\"rgba(243,242,242,0.85)\" font-size=\"15\" text-anchor=\"middle\" style=\"font-family:Lora,Georgia,serif;font-style:italic;\">θ</text><text x=\"95\" y=\"95\" fill=\"rgba(243,242,242,0.85)\" font-size=\"17\" text-anchor=\"middle\" style=\"font-family:Lora,Georgia,serif;font-style:italic;font-weight:700;\">u</text><text x=\"320\" y=\"194\" fill=\"rgba(243,242,242,0.85)\" font-size=\"17\" text-anchor=\"middle\" style=\"font-family:Lora,Georgia,serif;font-style:italic;font-weight:700;\">v</text><text x=\"110\" y=\"194\" fill=\"#cf9f55\" font-size=\"14\" text-anchor=\"middle\" style=\"font-family:Lora,Georgia,serif;font-style:italic;font-weight:700\">u∥ = proj<tspan dy=\"4\" font-size=\"10\">v</tspan><tspan dy=\"-4\"> u</tspan></text><text x=\"208\" y=\"110\" fill=\"#cf9f55\" font-size=\"15\" text-anchor=\"start\" style=\"font-family:Lora,Georgia,serif;font-style:italic;font-weight:700;\">u⊥</text></svg>"
 },
 {
  "id": "length",
  "x": 1480,
  "y": 90,
  "w": 390,
  "t": "Length of the projection",
  "m": [
   [
    "\\lVert\\operatorname{proj}_{\\mathbf v}\\mathbf u\\rVert=\\lVert\\mathbf u\\rVert\\cos\\theta",
    17
   ]
  ],
  "href": "../sec-projection.html#fig-projection"
 },
 {
  "id": "formula",
  "x": 1480,
  "y": 290,
  "w": 390,
  "t": "Projection formula",
  "gold": true,
  "m": [
   [
    "\\operatorname{proj}_{\\mathbf v}\\mathbf u=\\Bigl(\\dfrac{\\mathbf u\\cdot\\mathbf v}{\\lVert\\mathbf v\\rVert^2}\\Bigr)\\mathbf v",
    18
   ]
  ],
  "href": "../sec-projection.html#fact-projection-formula"
 },
 {
  "id": "decomp",
  "x": 1360,
  "y": 520,
  "w": 510,
  "t": "Parallel + perpendicular",
  "m": [
   [
    "\\mathbf u=\\underbrace{\\operatorname{proj}_{\\mathbf v}\\mathbf u}_{\\text{parallel to }\\mathbf v}+\\underbrace{\\bigl(\\mathbf u-\\operatorname{proj}_{\\mathbf v}\\mathbf u\\bigr)}_{\\text{perpendicular to }\\mathbf v}",
    17
   ]
  ],
  "href": "../sec-projection.html#par-decomposition"
 },
 {
  "id": "check",
  "x": 1360,
  "y": 800,
  "w": 510,
  "t": "Why the second piece is perpendicular",
  "m": [
   [
    "\\bigl(\\mathbf u-\\operatorname{proj}_{\\mathbf v}\\mathbf u\\bigr)\\cdot\\mathbf v=0",
    17
   ]
  ],
  "meta": "proved with the properties of the dot product",
  "href": "../sec-projection.html#check-projection-decomposition"
 }
];
const EDGES = [["lawcos", "angle", "gold"], ["dot", "def"], ["dot", "angle"], ["dot", "props"], ["angle", "orth"], ["angle", "proj"], ["proj", "projfig"], ["projfig", "length"], ["length", "formula", "gold"], ["formula", "decomp"], ["decomp", "check"], ["props", "check", "gold"], ["orth", "check"]];
const stage = document.getElementById('stage');
function tex(el, s, size) {
  const d = document.createElement('div');
  d.className = 'm'; d.style.fontSize = size + 'px';
  el.appendChild(d);
  katex.render(s, d, { throwOnError: false, displayMode: false });
  return d;
}
for (const n of NODES) {
  const el = document.createElement(n.href ? 'a' : 'div');
  el.className = 'node' + (n.gold ? ' gold' : '');
  if (n.href) { el.href = n.href; el.target = '_parent'; }
  el.dataset.node = n.id;
  el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; el.style.width = n.w + 'px';
  if (n.hub) {
    const h = document.createElement('div'); h.className = 'hub'; h.style.fontSize = n.hubSize + 'px'; h.textContent = n.hub; el.appendChild(h);
    if (n.rule) { const r = document.createElement('div'); r.className = 'rule'; el.appendChild(r); }
  }
  if (n.kick) { const k = document.createElement('div'); k.className = 'kick'; k.textContent = n.kick; el.appendChild(k); }
  if (n.t) {
    const t = document.createElement('div'); t.className = 't'; if (n.tSize) t.style.fontSize = n.tSize + 'px';
    if (n.tTex) { t.textContent = n.t.replace(/\\\(.*\\\)/, '') + ' '; const s = document.createElement('span'); t.appendChild(s); katex.render(n.tTex, s, { throwOnError: false }); }
    else t.textContent = n.t;
    el.appendChild(t);
  }
  if (n.figHtml) { const f = document.createElement('div'); f.className = 'fig' + (n.figInline ? ' inline' : ''); f.innerHTML = n.figHtml; if (n.figInline) el.insertBefore(f, el.firstChild); else el.appendChild(f); }
  if (n.m) for (const [s, size, note] of n.m) {
    const d = tex(el, s, size);
    if (note) { const sp = document.createElement('span'); sp.className = 'meta'; sp.style.cssText = 'font-size:14px;font-style:italic;margin-left:8px'; sp.textContent = note; d.appendChild(sp); }
  }
  if (n.meta) { const md = document.createElement('div'); md.className = 'm meta'; md.style.fontSize = '14px'; md.textContent = n.meta; el.appendChild(md); }
  stage.appendChild(el);
}
// connectors: an arrow points from a topic to what is built from it
const svg = document.getElementById('connectors');
const touching = {};   // node id -> its incident edge paths and neighbour ids
for (const [a, b, kind] of EDGES) {
  const rectOf = id => { const el = stage.querySelector('[data-node="' + id + '"]'); return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight }; };
  const A = rectOf(a), B = rectOf(b);
  const acx = A.x + A.w / 2, acy = A.y + A.h / 2, bcx = B.x + B.w / 2, bcy = B.y + B.h / 2;
  let d;
  if (Math.abs(bcx - acx) > Math.abs(bcy - acy)) {
    const p1 = bcx > acx ? [A.x + A.w, acy] : [A.x, acy];
    const p2 = bcx > acx ? [B.x, bcy] : [B.x + B.w, bcy];
    const k = (p2[0] - p1[0]) * 0.45;
    d = `M${p1[0]},${p1[1]} C${p1[0] + k},${p1[1]} ${p2[0] - k},${p2[1]} ${p2[0]},${p2[1]}`;
  } else {
    const p1 = bcy > acy ? [acx, A.y + A.h] : [acx, A.y];
    const p2 = bcy > acy ? [bcx, B.y] : [bcx, B.y + B.h];
    const k = (p2[1] - p1[1]) * 0.45;
    d = `M${p1[0]},${p1[1]} C${p1[0]},${p1[1] + k} ${p2[0]},${p2[1] - k} ${p2[0]},${p2[1]}`;
  }
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d); p.setAttribute('fill', 'none');
  p.setAttribute('class', kind === 'gold' ? 'gold' : 'plain');
  p.setAttribute('stroke', kind === 'gold' ? 'rgba(182,130,53,0.75)' : 'rgba(243,242,242,0.35)');
  p.setAttribute('stroke-width', '1.5');
  p.setAttribute('marker-end', kind === 'gold' ? 'url(#arr-gold)' : 'url(#arr-plain)');
  svg.appendChild(p);
  for (const id of [a, b]) {
    (touching[id] = touching[id] || { paths: [], nodes: [] });
    touching[id].paths.push(p);
    touching[id].nodes.push(id === a ? b : a);
  }
}
// hovering a topic lights up its connections and neighbours
for (const n of NODES) {
  const el = stage.querySelector('[data-node="' + n.id + '"]');
  const inc = touching[n.id];
  if (!inc) continue;
  el.addEventListener('mouseenter', () => {
    svg.classList.add('focus'); stage.classList.add('focus');
    for (const p of inc.paths) p.classList.add('hi');
    for (const id of inc.nodes) stage.querySelector('[data-node="' + id + '"]').classList.add('hi');
  });
  el.addEventListener('mouseleave', () => {
    svg.classList.remove('focus'); stage.classList.remove('focus');
    for (const p of inc.paths) p.classList.remove('hi');
    for (const id of inc.nodes) stage.querySelector('[data-node="' + id + '"]').classList.remove('hi');
  });
}
// scale to fit embedding width
function fit() {
  const w = document.documentElement.clientWidth;
  const s = w / 1920;
  stage.style.transform = 'scale(' + s + ')';
  document.getElementById('wrap').style.height = (1080 * s) + 'px';
}
fit(); window.addEventListener('resize', fit);
</script>

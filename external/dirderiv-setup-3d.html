<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The definition of the directional derivative: secant to tangent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,300..800&amp;family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Open Sans", system-ui, -apple-system, "Segoe UI",
      Roboto, sans-serif;
  }
  #app { width: 100%; box-sizing: border-box; }
  #controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 8px 10px; box-sizing: border-box;
  }
  button {
    font-size: 14px; padding: 5px 12px; border-radius: 6px;
    border: 1px solid #888; background: #f4f4f4; cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #e6e6e6; }
  button.active { background: #2a6fdb; color: #fff; border-color: #2a6fdb; }
  #playBtn { min-width: 92px; }
  #sliderRow {
    display: flex; align-items: center; gap: 10px;
    padding: 0 10px 6px 10px; box-sizing: border-box;
  }
  #sSlider { flex: 1; }
  #sLabel { font-size: 15px; min-width: 78px; font-variant-numeric: tabular-nums; }
  #readout { font-size: 14px; color: #333; padding: 0 10px 6px 10px; min-height: 1.2em;
    font-variant-numeric: tabular-nums; }
  #canvasWrap { width: 100%; position: relative; overflow: hidden; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
  /* math-style labels, in the same sans-serif family as the section text */
  .lbl3d {
    position: absolute; pointer-events: none; white-space: nowrap;
    /* mathematics, so the face the page sets its mathematics in */
    font-family: "PT Serif", "Times New Roman", Times, serif;
    font-style: italic; font-size: 17px; line-height: 1; font-weight: 400;
    text-shadow: -1px -1px 2px #fff, 1px -1px 2px #fff,
                 -1px 1px 2px #fff, 1px 1px 2px #fff;
  }
  .lbl3d b { font-weight: 700; }
  .lbl3d sub { font-size: 70%; font-style: normal; }
  /* legend */
  #legend {
    position: absolute; top: 8px; right: 8px;
    background: rgba(255,255,255,0.93);
    border: 1px solid #bbb; border-radius: 6px;
    padding: 6px 9px; font-size: 12.5px; color: #222;
    line-height: 1.3; pointer-events: none;
    max-width: 165px;
  }
  #legend > div {
    padding-left: 31px; text-indent: -31px; margin: 4px 0;
  }
  #legend i {
    font-family: "PT Serif", "Times New Roman", Times, serif;
    font-style: italic;
  }
  #legend sub { font-size: 70%; }
  .sw {
    display: inline-block; width: 24px; height: 0; margin-right: 7px;
    vertical-align: middle;
  }
  .solid4 { border-top: 4px solid; }
  .solid3 { border-top: 3px solid; }
  .dash4  { border-top: 4px dashed; }
  .patch {
    display: inline-block; width: 24px; height: 11px; margin-right: 7px;
    vertical-align: middle; border-radius: 2px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="controls">
    <span style="font-size:14px;">Definition of the directional derivative:</span>
    <button id="limitBtn" title="Animate the limit">&#9654; s &rarr; 0</button>
    <span style="flex:1"></span>
    <button id="zoomInBtn" title="Zoom in">+</button>
    <button id="zoomOutBtn" title="Zoom out">&minus;</button>
    <button id="playBtn" title="Toggle automatic rotation">&#9654; Rotate</button>
  </div>
  <div id="sliderRow">
    <span id="sLabel">s = 1.40</span>
    <input type="range" id="sSlider" min="0.05" max="1.6" step="0.01" value="1.4">
  </div>
  <div id="readout"></div>
  <div id="canvasWrap">
    <div id="legend">
      <div><span class="patch" style="background:rgba(79,143,214,0.55)"></span>surface <i>z</i> = <i>f</i>(<i>x</i>, <i>y</i>)</div>
      <div><span class="patch" style="background:rgba(242,193,78,0.6)"></span>vertical plane through <i>P</i><sub>0</sub> along <i><b>u</b></i></div>
      <div><span class="sw dash4" style="border-color:#777777"></span>heights <i>f</i>(<i>P</i><sub>0</sub>), <i>f</i>(<i>P</i>) of the surface above <i>P</i><sub>0</sub>, <i>P</i></div>
      <div><span class="sw solid4" style="border-color:#d1362f"></span>trace of the surface in the plane</div>
      <div><span class="sw dash4" style="border-color:#009e73"></span>secant through<br>(<i>P</i><sub>0</sub>, <i>f</i>(<i>P</i><sub>0</sub>)) and (<i>P</i>, <i>f</i>(<i>P</i>))</div>
      <div><span class="sw dash4" style="border-color:#333333"></span>tangent at<br>(<i>P</i><sub>0</sub>, <i>f</i>(<i>P</i><sub>0</sub>)), slope (<i>D</i><sub><i><b>u</b></i></sub><i>f</i>)<sub><i>P</i>&#8320;</sub></div>
      <div><span class="sw solid3" style="border-color:#2a6fdb"></span>unit vector <i><b>u</b></i></div>
      <div><span class="sw solid3" style="border-color:#9c27b0"></span>displacement <i>s</i><i><b>u</b></i></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  // ---------- the surface (strong curvature) and the construction ----------
  function f(x, y) { return 0.6 + 0.45 * x * x + 0.3 * y * y; }
  var P0 = { x: 0.7, y: 0.55 };
  var U = { x: 0.8, y: 0.6 };            // unit vector
  var DUF = 0.9 * P0.x * U.x + 0.6 * P0.y * U.y;   // (D_u f)_{P0} = 0.702
  var XMAX = 2.4, YMAX = 2.1;
  var TMIN = -0.5, TMAX = 2.0;           // extent along u for plane/lines
  var Z0 = f(P0.x, P0.y);
  // camera aims here; larger z pushes the scene DOWN on the screen
  var CENTER = new THREE.Vector3(1.2, 1.0, 2.55);

  // ---------- renderer / scene ----------
  var wrap = document.getElementById("canvasWrap");
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  wrap.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);

  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  camera.up.set(0, 0, 1); // z points up, math convention

  var radius = 7.6, theta = -0.5, phiCam = 1.15;
  var RMIN = 4.5, RMAX = 16;
  function placeCamera() {
    camera.position.set(
      CENTER.x + radius * Math.sin(phiCam) * Math.cos(theta),
      CENTER.y + radius * Math.sin(phiCam) * Math.sin(theta),
      CENTER.z + radius * Math.cos(phiCam)
    );
    camera.lookAt(CENTER);
  }

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  var dir1 = new THREE.DirectionalLight(0xffffff, 0.7);
  dir1.position.set(5, 3, 6);
  scene.add(dir1);
  var dir2 = new THREE.DirectionalLight(0xffffff, 0.35);
  dir2.position.set(-4, -5, -3);
  scene.add(dir2);

  var YUP = new THREE.Vector3(0, 1, 0);

  // thick solid arrow built from a cylinder shaft and a cone head
  function solidArrow(from, dirv, length, color, shaftR, group) {
    var mat = new THREE.MeshPhongMaterial({ color: color });
    var headL = Math.min(0.24, 0.4 * length);
    var shaftL = Math.max(length - headL, 0.001);
    var shaft = new THREE.Mesh(
      new THREE.CylinderGeometry(shaftR, shaftR, shaftL, 10), mat);
    shaft.quaternion.setFromUnitVectors(YUP, dirv);
    shaft.position.copy(from.clone().addScaledVector(dirv, shaftL / 2));
    var head = new THREE.Mesh(
      new THREE.ConeGeometry(shaftR * 2.4, headL, 12), mat);
    head.quaternion.setFromUnitVectors(YUP, dirv);
    head.position.copy(from.clone().addScaledVector(dirv, shaftL + headL / 2));
    (group || scene).add(shaft);
    (group || scene).add(head);
  }

  // thick dashed line built from short cylinder segments
  function dashedTube(a, b, rad, dash, gap, color, group) {
    var mat = new THREE.MeshPhongMaterial({ color: color });
    var dirv = b.clone().sub(a);
    var L = dirv.length();
    dirv.normalize();
    var t = 0;
    while (t < L) {
      var e = Math.min(t + dash, L);
      var seg = new THREE.Mesh(
        new THREE.CylinderGeometry(rad, rad, e - t, 8), mat);
      seg.quaternion.setFromUnitVectors(YUP, dirv);
      seg.position.copy(a.clone().addScaledVector(dirv, (t + e) / 2));
      (group || scene).add(seg);
      t = e + gap;
    }
  }

  // ---------- axes ----------
  function axis(from, to, color) {
    var g = new THREE.BufferGeometry().setFromPoints([from, to]);
    scene.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: color })));
  }
  axis(new THREE.Vector3(-0.5, 0, 0), new THREE.Vector3(3.0, 0, 0), 0x999999);
  axis(new THREE.Vector3(0, -0.5, 0), new THREE.Vector3(0, 2.7, 0), 0x999999);
  axis(new THREE.Vector3(0, 0, -0.3), new THREE.Vector3(0, 0, 4.6), 0x999999);

  // ---------- surface z = f(x, y) ----------
  (function buildSurface() {
    var nu = 40, nv = 36;
    var positions = [], indices = [];
    for (var j = 0; j <= nv; j++) {
      var y = (YMAX * j) / nv;
      for (var i = 0; i <= nu; i++) {
        var x = (XMAX * i) / nu;
        positions.push(x, y, f(x, y));
      }
    }
    for (var jj = 0; jj < nv; jj++) {
      for (var ii = 0; ii < nu; ii++) {
        var a = jj * (nu + 1) + ii, b = a + 1;
        var c = a + (nu + 1), d = c + 1;
        indices.push(a, b, d, a, d, c);
      }
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    var mat = new THREE.MeshPhongMaterial({
      color: 0x4f8fd6, transparent: true, opacity: 0.4,
      side: THREE.DoubleSide, depthWrite: false, shininess: 60
    });
    scene.add(new THREE.Mesh(geo, mat));
    var wire = new THREE.LineSegments(
      new THREE.WireframeGeometry(geo),
      new THREE.LineBasicMaterial({ color: 0x35659a, transparent: true, opacity: 0.1 })
    );
    scene.add(wire);
  })();

  // ---------- vertical plane through P0 in the direction u ----------
  (function () {
    var planeMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(TMAX - TMIN + 0.4, 4.3),
      new THREE.MeshPhongMaterial({
        color: 0xf2c14e, transparent: true, opacity: 0.22,
        side: THREE.DoubleSide, depthWrite: false
      })
    );
    planeMesh.rotation.order = "ZXY";
    planeMesh.rotation.x = Math.PI / 2;
    planeMesh.rotation.z = Math.atan2(U.y, U.x);
    var tm = (TMIN + TMAX) / 2;
    planeMesh.position.set(P0.x + tm * U.x, P0.y + tm * U.y, 2.15);
    scene.add(planeMesh);
  })();

  // ---------- trace curve: the plane cuts the surface ----------
  (function () {
    var pts = [];
    for (var i = 0; i <= 90; i++) {
      var t = TMIN + ((TMAX - TMIN) * i) / 90;
      var x = P0.x + t * U.x, y = P0.y + t * U.y;
      pts.push(new THREE.Vector3(x, y, f(x, y)));
    }
    var curve = new THREE.CatmullRomCurve3(pts);
    scene.add(new THREE.Mesh(
      new THREE.TubeGeometry(curve, 120, 0.032, 8, false),
      new THREE.MeshPhongMaterial({ color: 0xd1362f })));
  })();

  // ---------- tangent line at (P0, f(P0)): thick and dashed ----------
  dashedTube(
    new THREE.Vector3(P0.x + TMIN * U.x, P0.y + TMIN * U.y, Z0 + DUF * TMIN),
    new THREE.Vector3(P0.x + TMAX * U.x, P0.y + TMAX * U.y, Z0 + DUF * TMAX),
    0.035, 0.16, 0.1, 0x333333, scene);

  // ---------- fixed pieces: P0, u, its drop line, f(P0) ----------
  var p0Dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.06, 16, 16),
    new THREE.MeshPhongMaterial({ color: 0x35659a }));
  p0Dot.position.set(P0.x, P0.y, 0);
  scene.add(p0Dot);

  // unit vector u: thick blue arrow, drawn slightly above the plane
  solidArrow(new THREE.Vector3(P0.x, P0.y, 0.03),
             new THREE.Vector3(U.x, U.y, 0), 0.55, 0x2a6fdb, 0.035, scene);

  var f0Dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.06, 16, 16),
    new THREE.MeshPhongMaterial({ color: 0x222222 }));
  f0Dot.position.set(P0.x, P0.y, Z0);
  scene.add(f0Dot);

  // dashed drop line from P0 up to the surface; its length is the height f(P0)
  dashedTube(new THREE.Vector3(P0.x, P0.y, 0),
             new THREE.Vector3(P0.x, P0.y, Z0),
             0.022, 0.11, 0.08, 0x777777, scene);

  // ---------- movable pieces: su, P, drop line, f(P), SECANT ----------
  var movGroup = new THREE.Group();
  scene.add(movGroup);
  var pMat = new THREE.MeshPhongMaterial({ color: 0xd1362f });

  var sVal = 1.4;
  function pOfS() { return { x: P0.x + sVal * U.x, y: P0.y + sVal * U.y }; }

  function clearMov() {
    while (movGroup.children.length) {
      var m = movGroup.children.pop();
      if (m.geometry) m.geometry.dispose();
    }
  }

  function updateS() {
    clearMov();
    var P = pOfS(), zP = f(P.x, P.y);
    var m = (zP - Z0) / sVal;   // slope of the secant

    // displacement su: thick purple arrow in the xy-plane
    solidArrow(new THREE.Vector3(P0.x, P0.y, 0.012),
               new THREE.Vector3(U.x, U.y, 0), sVal, 0x9c27b0, 0.03,
               movGroup);

    // point P and its dashed vertical line up to the surface
    var pd = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), pMat);
    pd.position.set(P.x, P.y, 0); movGroup.add(pd);
    var fpd = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), pMat);
    fpd.position.set(P.x, P.y, zP); movGroup.add(fpd);
    // dashed drop line from P up to the surface; its length is the height f(P)
    dashedTube(new THREE.Vector3(P.x, P.y, 0),
               new THREE.Vector3(P.x, P.y, zP),
               0.022, 0.11, 0.08, 0x777777, movGroup);

    // SECANT: same thickness as the tangent, dashed, green
    dashedTube(
      new THREE.Vector3(P0.x + TMIN * U.x, P0.y + TMIN * U.y, Z0 + m * TMIN),
      new THREE.Vector3(P0.x + TMAX * U.x, P0.y + TMAX * U.y, Z0 + m * TMAX),
      0.035, 0.16, 0.1, 0x009e73, movGroup);

    // readout
    document.getElementById("readout").textContent =
      "slope of secant = ( f(P) − f(P₀) ) / s = " + m.toFixed(3) +
      "   →   slope of tangent = ( Dᵤf )₍P₀₎ = " + DUF.toFixed(3);
    render();
  }

  // ---------- point labels in the text font (HTML overlay, projected) ----------
  var labels = [];
  function addLabel(html, getPos, dx, dy, color) {
    var el = document.createElement("div");
    el.className = "lbl3d";
    el.innerHTML = html;
    if (color) el.style.color = color;
    wrap.appendChild(el);
    labels.push({ el: el, getPos: getPos, dx: dx, dy: dy });
  }
  addLabel("x", function () { return new THREE.Vector3(3.0, 0, 0); }, 6, 2, "#666666");
  addLabel("y", function () { return new THREE.Vector3(0, 2.7, 0); }, 6, 2, "#666666");
  addLabel("z", function () { return new THREE.Vector3(0, 0, 4.6); }, 8, -6, "#666666");
  addLabel("P<sub>0</sub>",
    function () { return new THREE.Vector3(P0.x, P0.y, 0); }, -24, 10, "#35659a");
  addLabel("P",
    function () { var P = pOfS(); return new THREE.Vector3(P.x, P.y, 0); },
    12, 6, "#d1362f");
  // height labels sit at the MIDPOINT of each dashed drop line, so it is
  // clear they measure the height of the surface above P0 and P; their
  // color matches the gray dashed drop lines they annotate
  addLabel("f(P<sub>0</sub>)",
    function () { return new THREE.Vector3(P0.x, P0.y, Z0 / 2); },
    12, 0, "#777777");
  addLabel("f(P)",
    function () {
      var P = pOfS(); return new THREE.Vector3(P.x, P.y, f(P.x, P.y) / 2);
    }, 12, 0, "#777777");

  function placeLabels() {
    var w = renderer.domElement.clientWidth,
        h = renderer.domElement.clientHeight;
    labels.forEach(function (L) {
      var v = L.getPos().project(camera);
      if (v.z > 1) { L.el.style.display = "none"; return; }
      L.el.style.display = "block";
      var x = (v.x * 0.5 + 0.5) * w + L.dx;
      var y = (-v.y * 0.5 + 0.5) * h + L.dy;
      x = Math.max(2, Math.min(w - 50, x));
      y = Math.max(2, Math.min(h - 20, y));
      L.el.style.left = x + "px";
      L.el.style.top = y + "px";
    });
  }

  // ---------- rendering / animation (starts PAUSED) ----------
  var playing = false;
  var rafId = null;

  function render() {
    renderer.render(scene, camera);
    placeLabels();
  }

  function animate() {
    if (!playing) return;
    theta += 0.006;
    placeCamera();
    render();
    rafId = requestAnimationFrame(animate);
  }

  var playBtn = document.getElementById("playBtn");
  playBtn.addEventListener("click", function () {
    playing = !playing;
    playBtn.innerHTML = playing ? "&#10074;&#10074; Pause" : "&#9654; Rotate";
    playBtn.classList.toggle("active", playing);
    if (playing) animate();
    else if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
  });

  // ---------- zoom (buttons, mouse wheel, pinch) ----------
  function zoomBy(factor) {
    radius = Math.min(RMAX, Math.max(RMIN, radius * factor));
    placeCamera();
    if (!playing) render();
  }
  document.getElementById("zoomInBtn").addEventListener("click",
    function () { zoomBy(1 / 1.15); });
  document.getElementById("zoomOutBtn").addEventListener("click",
    function () { zoomBy(1.15); });

  // ---------- s -> 0 limit animation ----------
  var slider = document.getElementById("sSlider");
  var limId = null;
  var limitBtn = document.getElementById("limitBtn");
  function stopLimit() {
    if (limId !== null) { cancelAnimationFrame(limId); limId = null; }
    limitBtn.classList.remove("active");
  }
  function limitStep() {
    sVal = Math.max(0.05, sVal - 0.011);
    slider.value = sVal;
    document.getElementById("sLabel").textContent = "s = " + sVal.toFixed(2);
    updateS();
    if (sVal > 0.05) limId = requestAnimationFrame(limitStep);
    else stopLimit();
  }
  limitBtn.addEventListener("click", function () {
    stopLimit();
    if (sVal <= 0.06) sVal = 1.6; // restart from the right
    limitBtn.classList.add("active");
    limId = requestAnimationFrame(limitStep);
  });

  slider.addEventListener("input", function () {
    stopLimit();
    sVal = parseFloat(slider.value);
    document.getElementById("sLabel").textContent = "s = " + sVal.toFixed(2);
    updateS();
  });

  // ---------- drag to rotate ----------
  var dragging = false, lastX = 0, lastY = 0;
  var pinchDist = 0;
  var el = renderer.domElement;
  function startDrag(x, y) { dragging = true; lastX = x; lastY = y; }
  function moveDrag(x, y) {
    if (!dragging) return;
    theta -= (x - lastX) * 0.008;
    phiCam = Math.min(Math.PI - 0.05, Math.max(0.05, phiCam - (y - lastY) * 0.008));
    lastX = x; lastY = y;
    placeCamera();
    if (!playing) render();
  }
  el.addEventListener("mousedown", function (e) { startDrag(e.clientX, e.clientY); });
  window.addEventListener("mousemove", function (e) { moveDrag(e.clientX, e.clientY); });
  window.addEventListener("mouseup", function () { dragging = false; });
  el.addEventListener("wheel", function (e) {
    e.preventDefault();
    zoomBy(Math.exp(e.deltaY * 0.001));
  }, { passive: false });
  el.addEventListener("touchstart", function (e) {
    if (e.touches.length === 1) {
      startDrag(e.touches[0].clientX, e.touches[0].clientY);
      e.preventDefault();
    } else if (e.touches.length === 2) {
      dragging = false;
      pinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY);
      e.preventDefault();
    }
  }, { passive: false });
  el.addEventListener("touchmove", function (e) {
    if (e.touches.length === 1) {
      moveDrag(e.touches[0].clientX, e.touches[0].clientY);
      e.preventDefault();
    } else if (e.touches.length === 2) {
      var d = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY);
      if (d > 0 && pinchDist > 0) zoomBy(pinchDist / d);
      pinchDist = d;
      e.preventDefault();
    }
  }, { passive: false });
  window.addEventListener("touchend", function () { dragging = false; pinchDist = 0; });

  // ---------- sizing (fills iframe) ----------
  function resize() {
    var w = document.getElementById("app").clientWidth;
    var used = document.getElementById("controls").offsetHeight +
               document.getElementById("sliderRow").offsetHeight +
               document.getElementById("readout").offsetHeight;
    var h = Math.max(220, window.innerHeight - used - 4);
    renderer.setSize(w, h);
    camera.aspect = w / h;
    // shift the whole scene to the LEFT so the legend does not cover it
    camera.setViewOffset(w, h, 0.10 * w, 0.06 * h, w, h);
    camera.updateProjectionMatrix();
    render();
  }
  window.addEventListener("resize", resize);

  // ---------- initial state: paused, s = 1.4 ----------
  placeCamera();
  resize();
  updateS();
})();
</script>
</body>
</html>

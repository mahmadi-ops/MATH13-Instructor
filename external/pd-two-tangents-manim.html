<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The two partial derivatives at P -- cut open</title>
<!-- The same two families the book itself loads (see pretext-html.xsl), so the
     figure's lettering matches the surrounding page rather than the reader's
     system UI font: Open Sans for text, PT Serif for the mathematics. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,300..800&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
  /* Manim-style palette: dark stage, saturated accents, light serif math.
     Kept in step with the book's other animated figures, and with the video
     this figure is the hands-on version of (assets/manim/pd_two_tangents.py):
     the cut y = y0 is green with a blue tangent, the cut x = x0 is amber with
     a red tangent, and the surface stays grey so the four coloured objects on
     it are the only saturated things on screen. */
  :root {
    --bg:        #06070a;
    --panel:     #101218;
    --edge:      #262a36;
    --ink:       #ece6e2;
    --dim:       #9aa0ad;
    --blue:      #58c4dd;
    --green:     #83c167;
    --red:       #fc6255;
    --gold:      #f0ac5f;
    --sans:  "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif: "PT Serif", "Times New Roman", Times, serif;
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
               background: var(--bg); }
  body { font-family: var(--sans); color: var(--ink);
         -webkit-font-smoothing: antialiased; }
  #app { width: 100%; height: 100%; box-sizing: border-box;
         display: flex; flex-direction: column; }

  /* ---- stage ---- */
  #stage { position: relative; width: 100%; background: var(--bg);
           flex: 1 1 auto; min-height: 0; overflow: hidden; }
  /* the renderer is sized with updateStyle off, so the canvas has to be told
     to fill the stage in CSS -- otherwise it draws at its buffer size, which is
     devicePixelRatio times too big, and the picture overflows the frame. */
  #stage canvas { display: block; width: 100%; height: 100%;
                  cursor: grab; touch-action: none; }
  #stage canvas:active { cursor: grabbing; }
  #stage canvas.pick { cursor: pointer; }

  .overlay { position: absolute; pointer-events: none; }

  /* the legend, top-left: the surface, the point, and one entry per cut that
     is open, naming the plane, the parabola and what the tangent's slope is */
  #legend {
    top: 12px; left: 14px; max-width: min(54%, 360px);
    padding: 8px 12px 9px 12px;
    background: rgba(16,18,24,0.78);
    border: 1px solid var(--edge);
    border-left: 3px solid var(--dim);
    border-radius: 6px;
    line-height: 1.45;
  }
  .math { font-family: var(--serif); font-size: 16px; }
  .math i { font-style: italic; }
  .math sub { font-size: 70%; }
  #legend .head { color: var(--ink); }
  #legend .head .at { color: var(--dim); }
  #rows { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--edge); }
  #rows .cut + .cut { margin-top: 8px; padding-top: 8px;
                      border-top: 1px dashed var(--edge); }
  #rows .line {
    display: flex; align-items: baseline; gap: 8px;
    font-family: var(--serif); font-size: 14px; color: var(--ink);
  }
  #rows .line + .line { margin-top: 3px; }
  #rows .line .swatch {
    width: 16px; height: 3px; border-radius: 2px; flex: 0 0 auto;
    transform: translateY(-4px);
  }
  #rows .line .swatch.plane { height: 9px; opacity: .55; transform: translateY(-1px); }
  #rows .why { font-family: var(--sans); font-size: 12px; color: var(--dim);
               margin: 1px 0 0 24px; line-height: 1.3; }
  #rows .why b { color: var(--ink); font-weight: 600; }
  #rows .empty { font-family: var(--sans); font-size: 12.5px;
                 font-style: italic; color: var(--dim); }

  /* the narration card, top-right: what the current step of the construction
     is doing, in the words of the video's corner readouts */
  #note {
    top: 12px; right: 14px; max-width: min(36%, 300px);
    padding: 8px 12px 9px 12px;
    background: rgba(16,18,24,0.78);
    border: 1px solid var(--edge);
    border-right: 3px solid var(--dim);
    border-radius: 6px;
    font-size: 13.5px; line-height: 1.4; color: var(--ink);
    opacity: 0; transition: opacity .35s;
  }
  #note.show { opacity: 1; }
  #note .math { font-size: 14.5px; }

  /* ---- control panel ---- */
  #panel {
    flex: 0 0 auto; border-top: 1px solid var(--edge);
    background: var(--panel); padding: 9px 50px 11px 12px; box-sizing: border-box;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .lbl { font-size: 13px; color: var(--dim); }

  button {
    font: inherit; font-size: 13.5px;
    padding: 5px 12px; border-radius: 999px;
    color: var(--ink); background: #1a1d26;
    border: 1px solid var(--edge);
    cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  }
  button:hover { background: #232734; }
  button .eq { font-family: var(--serif); font-style: italic; }
  button .eq sub { font-size: 70%; font-style: normal; }
  /* an active cut button wears its own colour, set from the palette in JS */
  button.on { color: #06070a; font-weight: 700; }
  #btnPlay.on, #btnSpin.on, #btnEyeY.on, #btnEyeX.on {
    background: var(--blue); border-color: var(--blue);
    color: #06070a; font-weight: 600;
  }

  @media (max-width: 620px) {
    #legend { padding: 7px 10px 8px 10px; top: 10px; left: 10px; max-width: 60%; }
    #note { max-width: 36%; font-size: 12px; padding: 6px 9px 7px 9px; }
    .math { font-size: 14px; }
    #rows .line { font-size: 12.5px; }
    #rows .why { display: none; }
    .lbl { display: none; }
    button { font-size: 12.5px; padding: 4px 10px; }
  }
</style>
</head>

<body>
<div id="app">
  <div id="stage">
    <div id="legend" class="overlay">
      <div class="math head">
        <i>z</i> = <i>f</i>(<i>x</i>,&#8202;<i>y</i>)
        <span class="at">at <i>P</i>(<i>x</i><sub>0</sub>,&#8202;<i>y</i><sub>0</sub>,&#8202;<i>f</i>(<i>x</i><sub>0</sub>,&#8202;<i>y</i><sub>0</sub>))</span>
      </div>
      <div id="rows"><div class="empty">no cut chosen yet</div></div>
    </div>
    <div id="note" class="overlay"></div>
  </div>

  <div id="panel">
    <div class="row">
      <span class="lbl">Cut:</span>
      <button class="cutBtn" data-i="0"><span class="eq">y</span> = <span class="eq">y<sub>0</sub></span></button>
      <button class="cutBtn" data-i="1"><span class="eq">x</span> = <span class="eq">x<sub>0</sub></span></button>
      <button id="btnAll">Both</button>
      <button id="btnClear">Clear</button>
      <button id="btnPlay">&#9654; Play</button>
      <span style="flex:1"></span>
      <span class="lbl">View:</span>
      <button id="btnEyeY">Along <span class="eq">y</span></button>
      <button id="btnEyeX">Along <span class="eq">x</span></button>
      <button id="btnSpin">Spin</button>
      <button id="btnReset">Reset</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  // Manim colour constants, so the palette below reads the way a Scene would.
  var BLUE_C = 0x58c4dd, GREEN_C = 0x83c167, GOLD_C = 0xf0ac5f,
      RED_C = 0xfc6255, INK = 0xece6e2;

  // ---------- the construction ----------
  // The surface, the point and the two cuts of the video and of the two
  // static figures: f(x,y) = 3 - 0.25 x^2 - 0.45 y^2 over the square
  // -2 <= x, y <= 2, and P at (x0, y0) = (0.5, 0.5).
  var A = 0.25, B = 0.45;
  function f(x, y) { return 3 - A * x * x - B * y * y; }
  var X0 = 0.5, Y0 = 0.5, Z0 = f(X0, Y0);        // P, z0 = 2.825
  var FX = -2 * A * X0, FY = -2 * B * Y0;        // df/dx = -0.25, df/dy = -0.45
  var L = 2, ZMAX = 3.4;                         // the drawn square and the height of the cuts
  var ZK = 0.78;                                 // z drawn at this fraction of the
                                                 // horizontal scale, as in the video:
                                                 // the bowl is shallow, and at full
                                                 // scale both tangents read as flat
  var REACH = 1.2;                               // half-length of a tangent line, in x or y

  var CUTS = [
    { key: "y0", colour: GREEN_C, css: "#83c167", tan: BLUE_C, tanCss: "#58c4dd",
      planeTex: "y = y₀", curveTex: "z = f(x, y₀)", slopeTex: "slope ∂f/∂x",
      slopeHtml: "&#8706;<i>f</i>/&#8706;<i>x</i>", slope: FX,
      curve: function (t) { return [t, Y0, f(t, Y0)]; },
      dir: [1, 0, FX],
      holdHtml: "hold <i>y</i> = <i>y</i><sub>0</sub>",
      planeHtml: "the plane <i>y</i> = <i>y</i><sub>0</sub>",
      curveHtml: "<i>z</i> = <i>f</i>(<i>x</i>,&#8202;<i>y</i><sub>0</sub>)",
      curveName: "green parabola", tanName: "blue tangent line",
      whyHtml: "the <b>partial derivative of <i>f</i> with respect to <i>x</i></b>: " +
               "how fast <i>f</i> changes in the <i>x</i>-direction, with <i>y</i> held at <i>y</i><sub>0</sub>" },
    { key: "x0", colour: GOLD_C, css: "#f0ac5f", tan: RED_C, tanCss: "#fc6255",
      planeTex: "x = x₀", curveTex: "z = f(x₀, y)", slopeTex: "slope ∂f/∂y",
      slopeHtml: "&#8706;<i>f</i>/&#8706;<i>y</i>", slope: FY,
      curve: function (t) { return [X0, t, f(X0, t)]; },
      dir: [0, 1, FY],
      holdHtml: "hold <i>x</i> = <i>x</i><sub>0</sub>",
      planeHtml: "the plane <i>x</i> = <i>x</i><sub>0</sub>",
      curveHtml: "<i>z</i> = <i>f</i>(<i>x</i><sub>0</sub>,&#8202;<i>y</i>)",
      curveName: "amber parabola", tanName: "red tangent line",
      whyHtml: "the <b>partial derivative of <i>f</i> with respect to <i>y</i></b>: " +
               "how fast <i>f</i> changes in the <i>y</i>-direction, with <i>x</i> held at <i>x</i><sub>0</sub>" }
  ];

  // ---------- renderer / scene ----------
  var stage = document.getElementById("stage");
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.appendChild(renderer.domElement);
  var canvas = renderer.domElement;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x06070a);

  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
  camera.up.set(0, 0, 1);

  function P3(x, y, z) { return new THREE.Vector3(x, y, ZK * z); }

  var CENTER = P3(0, 0, 1.75);
  // the viewpoint of the video and of the static figures
  var HOME_PHI = 1.22, HOME_THETA = -0.96;
  var radius = 9, theta = HOME_THETA, phi = HOME_PHI, aspect = 1;
  var targetPhi = null, targetTheta = null;

  // CLOUD samples what is actually drawn, so the camera can sit at the smallest
  // distance that still shows all of it from the current angle.
  var CLOUD = (function () {
    var pts = [], sx, sy;
    for (sx = -1; sx <= 1; sx += 2) for (sy = -1; sy <= 1; sy += 2) {
      pts.push(P3(1.12 * L * sx, 1.12 * L * sy, 0));
      pts.push(P3(1.0 * L * sx, 1.0 * L * sy, ZMAX + 0.3));
    }
    return pts.map(function (p) { return p.sub(CENTER); });
  })();

  var _e = new THREE.Vector3(), _upv = new THREE.Vector3(), _rt = new THREE.Vector3();
  function computeRadius() {
    _e.set(Math.sin(phi) * Math.cos(theta), Math.sin(phi) * Math.sin(theta), Math.cos(phi));
    _upv.set(0, 0, 1).addScaledVector(_e, -_e.z);
    if (_upv.lengthSq() < 1e-9) _upv.set(0, 1, 0); else _upv.normalize();
    _rt.crossVectors(_upv, _e).normalize();
    var tanHalf = Math.tan(camera.fov * Math.PI / 360);
    var tanV = tanHalf, tanH = tanHalf * aspect, r = 1;
    for (var i = 0; i < CLOUD.length; i++) {
      var d = CLOUD[i], along = d.dot(_e);
      r = Math.max(r, along + Math.abs(d.dot(_upv)) / tanV,
                      along + Math.abs(d.dot(_rt)) / tanH);
    }
    radius = 1.16 * r;   // air around the picture
    camera.far = 3 * radius;
    camera.updateProjectionMatrix();
  }

  function placeCamera() {
    computeRadius();
    camera.position.set(
      CENTER.x + radius * Math.sin(phi) * Math.cos(theta),
      CENTER.y + radius * Math.sin(phi) * Math.sin(theta),
      CENTER.z + radius * Math.cos(phi)
    );
    camera.lookAt(CENTER.x, CENTER.y, CENTER.z);
  }

  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  var key = new THREE.DirectionalLight(0xffffff, 0.45); key.position.set(5, 3, 6);
  var fill = new THREE.DirectionalLight(0xcfd8ff, 0.22); fill.position.set(-4, -5, 2);
  scene.add(key); scene.add(fill);

  // ---------- text sprites, in the book's serif ----------
  var LABELS = [];
  function paintLabel(rec) {
    var w = 512, h = 96, cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    var g = cv.getContext("2d");
    g.font = (rec.italic ? "italic " : "") + '48px "PT Serif", "Times New Roman", Times, serif';
    g.textAlign = "center"; g.textBaseline = "middle";
    // a dark halo keeps the lettering legible over the mesh and the planes
    g.lineWidth = 7; g.lineJoin = "round"; g.strokeStyle = "rgba(6,7,10,0.85)";
    g.strokeText(rec.text, w / 2, h / 2);
    g.fillStyle = rec.colour;
    g.fillText(rec.text, w / 2, h / 2);
    var tex = new THREE.CanvasTexture(cv);
    tex.minFilter = THREE.LinearFilter;
    if (rec.sprite.material.map) rec.sprite.material.map.dispose();
    rec.sprite.material.map = tex;
    rec.sprite.material.needsUpdate = true;
  }
  // The labels keep one size on screen whatever their distance from the
  // camera (sizeAttenuation off): scale is then measured at unit distance,
  // where the view is 2 tan(fov/2) = 0.73 high, so 0.05 is 7% of the stage.
  function makeLabel(text, colour, scale, italic) {
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({
      transparent: true, depthTest: false, opacity: 0, sizeAttenuation: false
    }));
    sp.scale.set(scale * 5.333, scale, 1);
    var rec = { text: text, colour: colour, sprite: sp, italic: italic !== false };
    LABELS.push(rec); paintLabel(rec);
    return sp;
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { LABELS.forEach(paintLabel); });
  }

  // ---------- the surface ----------
  // Grey, in the checkerboard the manim Surface draws, and translucent enough
  // that the planes and the far halves of the parabolas show through it.
  (function buildSurface() {
    var N = 20, pos = [], col = [], i, j;
    var light = new THREE.Color(0x9ba0ab), dark = new THREE.Color(0x5c6170);
    function push(x, y, c) {
      var p = P3(x, y, f(x, y));
      pos.push(p.x, p.y, p.z); col.push(c.r, c.g, c.b);
    }
    for (i = 0; i < N; i++) {
      for (j = 0; j < N; j++) {
        var x0 = -L + 2 * L * i / N, x1 = -L + 2 * L * (i + 1) / N,
            y0 = -L + 2 * L * j / N, y1 = -L + 2 * L * (j + 1) / N,
            c = (i + j) % 2 ? light : dark;
        push(x0, y0, c); push(x1, y0, c); push(x1, y1, c);
        push(x0, y0, c); push(x1, y1, c); push(x0, y1, c);
      }
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    geo.computeVertexNormals();
    scene.add(new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
      vertexColors: true, transparent: true, opacity: 0.34,
      side: THREE.DoubleSide, shininess: 12, depthWrite: false
    })));

    // the mesh lines of the checkerboard
    var wp = [];
    for (i = 0; i <= N; i++) {
      var u = -L + 2 * L * i / N;
      for (j = 0; j < N; j++) {
        var v0 = -L + 2 * L * j / N, v1 = -L + 2 * L * (j + 1) / N;
        var a1 = P3(u, v0, f(u, v0)), a2 = P3(u, v1, f(u, v1));
        var b1 = P3(v0, u, f(v0, u)), b2 = P3(v1, u, f(v1, u));
        wp.push(a1.x, a1.y, a1.z, a2.x, a2.y, a2.z, b1.x, b1.y, b1.z, b2.x, b2.y, b2.z);
      }
    }
    var wgeo = new THREE.BufferGeometry();
    wgeo.setAttribute("position", new THREE.Float32BufferAttribute(wp, 3));
    scene.add(new THREE.LineSegments(wgeo, new THREE.LineBasicMaterial({
      color: 0xd8dce6, transparent: true, opacity: 0.16
    })));
  })();

  // ---------- axes and floor ----------
  (function buildAxes() {
    var ax = [
      P3(-L - 0.3, 0, 0), P3(L + 0.5, 0, 0),
      P3(0, -L - 0.3, 0), P3(0, L + 0.5, 0),
      P3(0, 0, 0), P3(0, 0, ZMAX + 0.3)
    ];
    var g = new THREE.BufferGeometry().setFromPoints(ax);
    scene.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({
      color: 0xc9ced9, transparent: true, opacity: 0.5
    })));
    var fl = [], n = 8, i;
    for (i = -n; i <= n; i++) {
      var u = L * i / n;
      fl.push(-L, u, 0, L, u, 0, u, -L, 0, u, L, 0);
    }
    var fg = new THREE.BufferGeometry();
    fg.setAttribute("position", new THREE.Float32BufferAttribute(fl, 3));
    scene.add(new THREE.LineSegments(fg, new THREE.LineBasicMaterial({
      color: 0x39404e, transparent: true, opacity: 0.45
    })));
    var lx = makeLabel("x", "#c9ced9", 0.042), ly = makeLabel("y", "#c9ced9", 0.042),
        lz = makeLabel("z", "#c9ced9", 0.042);
    lx.position.copy(P3(L + 0.75, 0, 0)); ly.position.copy(P3(0, L + 0.75, 0));
    lz.position.copy(P3(0, 0, ZMAX + 0.62));
    lx.material.opacity = ly.material.opacity = lz.material.opacity = 0.9;
    scene.add(lx); scene.add(ly); scene.add(lz);
  })();

  // ---------- rods, for the tangent lines, plane edges and the drop line ----------
  var ROD = new THREE.CylinderGeometry(1, 1, 1, 12, 1, true);
  ROD.translate(0, 0.5, 0);
  var _yUp = new THREE.Vector3(0, 1, 0), _dir = new THREE.Vector3();
  function rod(from, to, r, colour, opacity) {
    var m = new THREE.Mesh(ROD, new THREE.MeshBasicMaterial({
      color: colour, transparent: true,
      opacity: opacity === undefined ? 1 : opacity
    }));
    _dir.subVectors(to, from);
    var len = _dir.length();
    m.position.copy(from);
    m.quaternion.setFromUnitVectors(_yUp, _dir.clone().normalize());
    m.scale.set(r, len, r);
    m.userData.len = len; m.userData.r = r; m.userData.from = from.clone();
    m.userData.mid = from.clone().add(to).multiplyScalar(0.5);
    return m;
  }
  // a rod that grows out from its middle, the way Create() draws a Line
  function setRodProgress(m, t) {
    var half = m.userData.len * t / 2;
    _dir.set(0, 1, 0).applyQuaternion(m.quaternion);
    m.position.copy(m.userData.mid).addScaledVector(_dir, -half);
    m.scale.set(m.userData.r, Math.max(1e-4, 2 * half), m.userData.r);
    m.visible = t > 0.002;
  }

  // ---------- P ----------
  var pDot = new THREE.Mesh(new THREE.SphereGeometry(0.07, 20, 14),
                            new THREE.MeshBasicMaterial({ color: INK }));
  pDot.position.copy(P3(X0, Y0, Z0));
  scene.add(pDot);
  var pGround = new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 12),
                               new THREE.MeshBasicMaterial({ color: INK, transparent: true, opacity: 0.8 }));
  pGround.position.copy(P3(X0, Y0, 0));
  scene.add(pGround);
  scene.add(rod(P3(X0, Y0, 0), P3(X0, Y0, Z0), 0.009, 0xb8c0cc, 0.6));
  var pTag = makeLabel("P", "#ece6e2", 0.05);
  pTag.position.copy(P3(X0 + 0.36, Y0 + 0.3, Z0 + 0.34));
  pTag.material.opacity = 0.98;
  scene.add(pTag);

  // ---------- one bundle per cut ----------
  var pickable = [];

  CUTS.forEach(function (C, i) {
    C.group = new THREE.Group();
    scene.add(C.group);

    // the cutting plane: a translucent slab over the square the surface
    // covers, up to z = ZMAX, with its four edges drawn as thin rods so it is
    // seen at once, even where the grey surface lies in front of it
    var quad = C.key === "y0"
      ? [P3(-L, Y0, 0), P3(L, Y0, 0), P3(L, Y0, ZMAX), P3(-L, Y0, ZMAX)]
      : [P3(X0, -L, 0), P3(X0, L, 0), P3(X0, L, ZMAX), P3(X0, -L, ZMAX)];
    var pg = new THREE.BufferGeometry().setFromPoints(
      [quad[0], quad[1], quad[2], quad[0], quad[2], quad[3]]);
    pg.computeVertexNormals();
    C.plane = new THREE.Mesh(pg, new THREE.MeshBasicMaterial({
      color: C.colour, transparent: true, opacity: 0.24,
      side: THREE.DoubleSide, depthWrite: false
    }));
    C.group.add(C.plane);
    C.edges = [];
    for (var e = 0; e < 4; e++) {
      var rd = rod(quad[e], quad[(e + 1) % 4], 0.013, C.colour, 0.85);
      C.edges.push(rd); C.group.add(rd);
    }
    // the plane's name, on its top edge
    C.planeTag = makeLabel(C.planeTex, C.css, 0.046);
    var top = C.key === "y0" ? P3(-L + 0.55, Y0, ZMAX + 0.22) : P3(X0, L - 0.55, ZMAX + 0.22);
    C.planeTag.position.copy(top);
    C.group.add(C.planeTag);

    // the parabola the plane cuts out of the surface, as a thick tube
    var pts = [];
    for (var k = 0; k <= 80; k++) {
      var t = -L + 2 * L * k / 80, q = C.curve(t);
      pts.push(P3(q[0], q[1], q[2] + 0.025));
    }
    C.traceGeo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 80, 0.042, 10, false);
    C.trace = new THREE.Mesh(C.traceGeo, new THREE.MeshBasicMaterial({ color: C.colour }));
    C.trace.visible = false;
    C.group.add(C.trace);
    C.traceCount = C.traceGeo.index.count;
    // the parabola's name, past its far end
    C.traceTag = makeLabel(C.curveTex, C.css, 0.05);
    var far = C.key === "y0" ? C.curve(L) : C.curve(-L);
    C.traceTag.position.copy(C.key === "y0" ? P3(far[0] + 0.1, far[1] - 0.75, far[2] + 0.02)
                                            : P3(far[0] + 0.72, far[1] - 0.1, far[2] + 0.08));
    C.group.add(C.traceTag);

    // the tangent line at P, in the plane, longer and thicker than the
    // parabola so the two never blur into one stroke
    var d = C.dir, R = REACH;
    var a = P3(X0 - R * d[0], Y0 - R * d[1], Z0 - R * d[2]),
        b = P3(X0 + R * d[0], Y0 + R * d[1], Z0 + R * d[2]);
    C.tangent = rod(a, b, 0.055, C.tan);
    C.tangent.visible = false;
    C.group.add(C.tangent);
    // which slope the tangent line's slope is, at its far end
    // the two slope labels sit at opposite ends of their tangent lines, or
    // they land on top of each other beside P
    var end = C.key === "y0" ? 1.1 : -1.1;
    C.slopeTag = makeLabel(C.slopeTex, C.tanCss, 0.054);
    C.slopeTag.position.copy(P3(X0 + end * R * d[0], Y0 + end * R * d[1],
                                Z0 + end * R * d[2] + 0.4));
    C.group.add(C.slopeTag);

    // an invisible slab along the parabola, so the curve itself can be clicked
    C.hit = new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 30, 0.18, 6, false),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    C.hit.userData.cut = i;
    C.group.add(C.hit);
    pickable.push(C.hit);

    // the construction of a cut runs in three steps, as in the video: the
    // plane (0 to 1), then the parabola (1 to 2), then the tangent (2 to 3)
    C.target = 0;
    C.grow = 0;
  });

  // ---------- the legend and the narration card ----------
  var rowsEl = document.getElementById("rows"), noteEl = document.getElementById("note");

  function cutRows(C) {
    return '<div class="cut">' +
      '<div class="line"><span class="swatch plane" style="background:' + C.css + '"></span>' +
      '<span>' + C.holdHtml + ': ' + C.planeHtml + ' cuts out the ' + C.curveName +
      ' <span style="white-space:nowrap">' + C.curveHtml + '</span></span></div>' +
      '<div class="line"><span class="swatch" style="background:' + C.tanCss + '"></span>' +
      '<span>its ' + C.tanName + ' at <i>P</i> has slope ' + C.slopeHtml + '</span></div>' +
      '<div class="why">' + C.whyHtml + '</div>' +
      '</div>';
  }

  function refreshReadout() {
    var chosen = CUTS.filter(function (C) { return C.target > 0; });
    if (!chosen.length) {
      rowsEl.innerHTML = '<div class="empty">no cut chosen yet</div>';
      return;
    }
    rowsEl.innerHTML = chosen.map(cutRows).join("");
  }

  var noteTimer = null;
  function note(html, hold) {
    if (noteTimer) { clearTimeout(noteTimer); noteTimer = null; }
    if (!html) { noteEl.classList.remove("show"); return; }
    noteEl.innerHTML = html;
    noteEl.classList.add("show");
    if (hold) noteTimer = setTimeout(function () { noteEl.classList.remove("show"); }, hold);
  }

  function setCut(i, target) {
    var C = CUTS[i];
    C.target = target;
    var btn = document.querySelectorAll(".cutBtn")[i], on = target > 0;
    btn.classList.toggle("on", on);
    btn.style.background = on ? C.css : "";
    btn.style.borderColor = on ? C.css : "";
    refreshReadout();
  }

  function toggleCut(i) {
    var C = CUTS[i], on = C.target === 0;
    stopPlay();
    setCut(i, on ? 3 : 0);
    note(on ? '<span class="math">' + C.holdHtml + '</span>: ' + C.planeHtml +
              ' cuts out the ' + C.curveName + '; its tangent line at <i>P</i> has slope ' +
              '<span class="math">' + C.slopeHtml + '</span>, the rate of change of <i>f</i> in the ' +
              (C.key === "y0" ? '<i>x</i>' : '<i>y</i>') + '-direction.' : "", on ? 7000 : 0);
  }

  document.querySelectorAll(".cutBtn").forEach(function (b) {
    b.addEventListener("click", function () { toggleCut(+b.dataset.i); });
  });
  document.getElementById("btnAll").addEventListener("click", function () {
    stopPlay();
    CUTS.forEach(function (C, i) { setCut(i, 3); });
    note('Both cuts at once: two tangent lines at the same point <i>P</i>, one in each ' +
         'coordinate direction, whose slopes are the two partial derivatives ' +
         '<span class="math">&#8706;<i>f</i>/&#8706;<i>x</i></span> and ' +
         '<span class="math">&#8706;<i>f</i>/&#8706;<i>y</i></span>.', 8000);
  });
  document.getElementById("btnClear").addEventListener("click", function () {
    stopPlay();
    CUTS.forEach(function (C, i) { setCut(i, 0); });
    note("");
  });

  // ---------- Play: the video's three acts ----------
  // The surface alone; the plane y = y0, the parabola it cuts out and the
  // tangent to it; the surface alone again and the same three steps in
  // x = x0; then both constructions together while the camera turns.
  var btnPlay = document.getElementById("btnPlay"), playing = false, playTimers = [];

  function later(ms, fn) { playTimers.push(setTimeout(fn, ms)); }

  function act(i, t0, holdNote) {
    var C = CUTS[i], dirName = C.key === "y0" ? "<i>x</i>" : "<i>y</i>";
    later(t0, function () {
      setCut(i, 1);
      note('<span class="math">' + C.holdHtml + '</span>: ' + C.planeHtml + ' slices the surface.');
    });
    later(t0 + 1500, function () {
      setCut(i, 2);
      note('The slice leaves the ' + C.curveName + ' <span class="math">' + C.curveHtml +
           '</span> on the surface.');
    });
    later(t0 + 3300, function () {
      setCut(i, 3);
      note('The ' + C.tanName + ' to that parabola at <i>P</i>: its slope is ' +
           '<span class="math">' + C.slopeHtml + '</span>, the rate of change of <i>f</i> in the ' +
           dirName + '-direction.', holdNote);
    });
  }

  function startPlay() {
    stopPlay();
    playing = true;
    btnPlay.classList.add("on");
    spinning = false; btnSpin.classList.remove("on");
    btnEyeY.classList.remove("on"); btnEyeX.classList.remove("on");
    targetPhi = HOME_PHI; targetTheta = HOME_THETA;
    CUTS.forEach(function (C, i) { setCut(i, 0); });
    note('The surface <span class="math"><i>z</i> = <i>f</i>(<i>x</i>,&#8202;<i>y</i>)</span> ' +
         'and the point <i>P</i> on it.');
    act(0, 1800);                                   // act one: df/dx
    later(8000, function () {                       // the surface alone again
      setCut(0, 0); note("");
    });
    act(1, 9200);                                   // act two: df/dy
    later(15600, function () {                      // act three: both at once
      setCut(0, 3);
      note('Both together: two tangent lines at <i>P</i>, one in each coordinate direction. ' +
           'Their slopes are the two partial derivatives of <i>f</i> at <i>P</i>, ' +
           '<span class="math">&#8706;<i>f</i>/&#8706;<i>x</i></span> and ' +
           '<span class="math">&#8706;<i>f</i>/&#8706;<i>y</i></span>.');
    });
    later(17800, function () {                      // a slow turn, to place the two lines in space
      targetPhi = HOME_PHI; targetTheta = -0.44; slowCamera = true;
    });
    later(23500, function () { playing = false; btnPlay.classList.remove("on"); slowCamera = false; });
  }
  function stopPlay() {
    playTimers.forEach(clearTimeout); playTimers = [];
    if (playing) { playing = false; btnPlay.classList.remove("on"); slowCamera = false; }
  }
  btnPlay.addEventListener("click", function () {
    if (playing) { stopPlay(); note(""); } else startPlay();
  });

  // ---------- picking a parabola in the picture ----------
  var raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
  var dragging = false, dragged = false;

  function pick(e) {
    var b = canvas.getBoundingClientRect();
    pointer.x = ((e.clientX - b.left) / b.width) * 2 - 1;
    pointer.y = -((e.clientY - b.top) / b.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    var hits = raycaster.intersectObjects(pickable, false);
    return hits.length ? hits[0].object.userData.cut : -1;
  }

  canvas.addEventListener("pointermove", function (e) {
    if (dragging) return;
    canvas.classList.toggle("pick", pick(e) >= 0);
  });
  canvas.addEventListener("pointerleave", function () { canvas.classList.remove("pick"); });

  // ---------- drag to orbit ----------
  var lastX = 0, lastY = 0;
  canvas.addEventListener("pointerdown", function (e) {
    dragging = true; dragged = false; lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    if (Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY) > 2) dragged = true;
    targetPhi = targetTheta = null;
    theta -= (e.clientX - lastX) * 0.008;
    phi = Math.max(0.16, Math.min(Math.PI / 2 + 0.18, phi - (e.clientY - lastY) * 0.008));
    lastX = e.clientX; lastY = e.clientY;
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) {
    canvas.addEventListener(ev, function (e) {
      if (ev === "pointerup" && dragging && !dragged) {
        var i = pick(e);
        if (i >= 0) toggleCut(i);
      }
      dragging = false;
    });
  });

  // ---------- view buttons ----------
  // Looking along y puts the plane y = y0 edge on and the x-z plane on the
  // screen, so the green parabola and the blue tangent are seen in true shape
  // and the tangent shows its true slope; looking along x does the same for
  // the amber parabola and the red tangent. Only one can be active at a time.
  var btnEyeY = document.getElementById("btnEyeY"),
      btnEyeX = document.getElementById("btnEyeX");
  var spinning = false, slowCamera = false, btnSpin = document.getElementById("btnSpin");

  function eye(btn, other, theta0) {
    btn.addEventListener("click", function () {
      var on = !btn.classList.contains("on");
      stopPlay();
      btn.classList.toggle("on", on);
      other.classList.remove("on");
      spinning = false;
      btnSpin.classList.remove("on");
      targetPhi = on ? Math.PI / 2 - 0.02 : HOME_PHI;
      targetTheta = on ? theta0 : HOME_THETA;
    });
  }
  eye(btnEyeY, btnEyeX, -Math.PI / 2);   // camera down the -y axis
  eye(btnEyeX, btnEyeY, 0);              // camera down the +x axis

  btnSpin.addEventListener("click", function () {
    spinning = !spinning;
    btnSpin.classList.toggle("on", spinning);
    if (spinning) {
      stopPlay();
      targetPhi = targetTheta = null;
      btnEyeY.classList.remove("on"); btnEyeX.classList.remove("on");
    }
  });
  document.getElementById("btnReset").addEventListener("click", function () {
    stopPlay();
    spinning = false;
    btnSpin.classList.remove("on");
    btnEyeY.classList.remove("on"); btnEyeX.classList.remove("on");
    targetPhi = HOME_PHI; targetTheta = HOME_THETA;
  });

  // ---------- resize / loop ----------
  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    aspect = w / h;
    camera.aspect = aspect;
    // the picture is pushed a little down and to the right, out from under
    // the legend and the narration card in the top corners
    camera.setViewOffset(w, h, -0.09 * w, -0.07 * h, w, h);
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);

  function clamp01(v) { return Math.max(0, Math.min(1, v)); }

  var clock = new THREE.Clock(), lastW = 0, lastH = 0;
  function tick() {
    var dt = Math.min(clock.getDelta(), 0.05);
    if (stage.clientWidth !== lastW || stage.clientHeight !== lastH) {
      lastW = stage.clientWidth; lastH = stage.clientHeight;
      resize();
    }

    CUTS.forEach(function (C) {
      // each step runs at its own pace: a fade for the plane, a draw for the
      // parabola, a draw for the tangent; turning a cut off fades it all out
      var rate = C.target < C.grow ? 3.4 : (C.grow < 1 ? 1.5 : C.grow < 2 ? 1.2 : 1.6);
      var step = rate * dt;
      if (C.grow < C.target) C.grow = Math.min(C.target, C.grow + step);
      else if (C.grow > C.target) C.grow = Math.max(C.target, C.grow - step);

      var sPlane = clamp01(C.grow), sTrace = clamp01(C.grow - 1), sTan = clamp01(C.grow - 2);
      if (C.target === 0) { sPlane = sTrace = sTan = clamp01(C.grow / 3); }

      C.plane.visible = sPlane > 0.01;
      C.plane.material.opacity = 0.24 * sPlane;
      C.edges.forEach(function (r) { r.visible = sPlane > 0.01; r.material.opacity = 0.85 * sPlane; });
      C.planeTag.material.opacity = sPlane;

      // the parabola draws itself in from one end, the way Create() does
      C.trace.visible = sTrace > 0.02;
      C.traceGeo.setDrawRange(0, Math.max(6, Math.floor(C.traceCount * sTrace)));
      C.traceTag.material.opacity = clamp01((sTrace - 0.6) / 0.4);

      setRodProgress(C.tangent, sTan);
      C.slopeTag.material.opacity = clamp01((sTan - 0.6) / 0.4);
    });

    if (targetPhi !== null) {
      var k = Math.min(1, dt * (slowCamera ? 0.9 : 3.2));
      phi += (targetPhi - phi) * k;
      theta += (targetTheta - theta) * k;
      if (Math.abs(targetPhi - phi) < 0.002 && Math.abs(targetTheta - theta) < 0.002) {
        phi = targetPhi; theta = targetTheta; targetPhi = targetTheta = null;
      }
    }
    if (spinning && !dragging) theta += 0.3 * dt;

    placeCamera();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  resize();
  refreshReadout();
  placeCamera();
  tick();
})();
</script>
<!-- m13-fullscreen-button -->
<script>
(function () {
  "use strict";
  var btn = document.createElement("button");
  btn.id = "m13FsBtn";
  btn.type = "button";
  btn.title = "Full screen";
  btn.setAttribute("aria-label", "Toggle full screen");
  btn.innerHTML = "⛶";
  btn.style.cssText = [
    "position:fixed", "right:10px", "bottom:10px", "z-index:2147483647",
    "width:34px", "height:34px", "border-radius:50%",
    "border:1px solid rgba(127,127,127,.55)",
    "background:rgba(20,22,30,.62)", "color:#ece6e2",
    "font-size:17px", "line-height:1", "cursor:pointer", "padding:0",
    "opacity:.55", "transition:opacity .15s"
  ].join(";");
  btn.addEventListener("mouseenter", function () { btn.style.opacity = "1"; });
  btn.addEventListener("mouseleave", function () { btn.style.opacity = ".55"; });
  btn.addEventListener("click", function () {
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({ type: "m13-fullscreen-toggle" }, "*");
        return;
      } catch (e) { /* fall through to the standalone path */ }
    }
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen();
    }
  });
  function add() { document.body.appendChild(btn); }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", add);
  } else {
    add();
  }
})();
</script>
</body>

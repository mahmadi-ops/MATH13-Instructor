<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three paths to the origin -- xy/(x&#178;+y&#178;)</title>
<!-- The same two families the book itself loads (see pretext-html.xsl), so the
     figure's lettering matches the surrounding page rather than the reader's
     system UI font: Open Sans for text, PT Serif for the mathematics. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,300..800&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
  /* Manim-style palette: dark stage, saturated accents, light serif math.
     Kept in step with the book's other animated figures. */
  :root {
    --bg:        #06070a;
    --panel:     #101218;
    --edge:      #262a36;
    --ink:       #ece6e2;
    --dim:       #9aa0ad;
    --blue:      #58c4dd;
    --green:     #83c167;
    --yellow:    #ffe14d;
    --red:       #fc6255;
    --gold:      #f0ac5f;
    --sans:  "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif: "PT Serif", "Times New Roman", Times, serif;
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
               background: var(--bg); }
  body { font-family: var(--sans); color: var(--ink);
         -webkit-font-smoothing: antialiased; }
  #app { width: 100%; height: 100%; box-sizing: border-box;
         display: flex; flex-direction: column; }

  /* ---- header: the equation and the readout, in their own bar above the
     stage so that nothing sits on top of the picture itself ---- */
  #top {
    flex: 0 0 auto; display: flex; align-items: stretch; gap: 10px;
    padding: 8px 12px; box-sizing: border-box;
    background: var(--panel); border-bottom: 1px solid var(--edge);
  }

  /* ---- stage ---- */
  #stage { position: relative; width: 100%; background: var(--bg);
           flex: 1 1 auto; min-height: 0; overflow: hidden; }
  /* the renderer is sized with updateStyle off, so the canvas has to be told
     to fill the stage in CSS -- otherwise it draws at its buffer size, which is
     devicePixelRatio times too big, and the picture overflows the frame. */
  #stage canvas { display: block; width: 100%; height: 100%;
                  cursor: grab; touch-action: none; }
  #stage canvas:active { cursor: grabbing; }
  #stage canvas.pick { cursor: pointer; }

  /* the function, left half of the header bar */
  #eqcard {
    padding: 9px 13px 10px 13px;
    background: #14161e;
    border: 1px solid var(--edge);
    border-left: 3px solid var(--blue);
    border-radius: 6px;
    line-height: 1.5;
  }
  .math { font-family: var(--serif); font-size: 17px; }
  .math i { font-style: italic; }
  .frac { display: inline-block; text-align: center; vertical-align: -0.62em;
          margin: 0 2px; }
  .frac .num { display: block; padding: 0 3px; }
  .frac .den { display: block; padding: 0 3px; border-top: 1px solid currentColor; }
  #eqcard .sub { font-size: 13px; color: var(--dim); font-family: var(--sans); }

  /* what the chosen paths report, right half of the header bar: all three
     paths are always listed (a dash until one is chosen) so the bar keeps a
     constant height and the stage below it never jumps */
  #readout {
    margin-left: auto; min-width: 190px;
    padding: 8px 12px 9px 12px;
    background: #14161e;
    border: 1px solid var(--edge); border-radius: 6px;
    font-size: 13px; color: var(--dim);
  }
  #readout .title { font-size: 12px; letter-spacing: .3px;
                    text-transform: uppercase; color: var(--dim); }
  #readout .row {
    display: flex; align-items: baseline; gap: 8px;
    margin-top: 4px; font-family: var(--serif); font-size: 14.5px;
    color: var(--ink);
  }
  #readout .row.off { opacity: 0.45; }
  #readout .row .swatch {
    width: 16px; height: 3px; border-radius: 2px; flex: 0 0 auto;
    transform: translateY(-4px);
  }
  #readout .row .val { margin-left: auto; font-weight: 700; }
  /* the verdict keeps its line of space even while hidden, again so the
     header height (and with it the canvas) stays put */
  #verdict {
    margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--edge);
    font-size: 13px; line-height: 1.35; color: var(--red); font-weight: 600;
    min-height: 1.35em; visibility: hidden;
  }
  #verdict.show { visibility: visible; }

  /* guidance, its own strip between the stage and the buttons, still fading
     in like a manim Write() but no longer laid over the picture */
  #caption {
    flex: 0 0 auto; box-sizing: border-box;
    width: 100%; min-height: 32px;
    text-align: center; font-size: 14px; line-height: 1.4; color: var(--dim);
    background: var(--bg); border-top: 1px solid var(--edge);
    padding: 6px 14px;
    opacity: 0; transition: opacity .45s ease;
  }
  #caption.show { opacity: 1; }

  /* ---- control panel ---- */
  #panel {
    flex: 0 0 auto; border-top: 1px solid var(--edge);
    background: var(--panel); padding: 9px 12px 11px 12px; box-sizing: border-box;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .row + .row { margin-top: 9px; }
  .lbl { font-size: 13px; color: var(--dim); }

  button {
    font: inherit; font-size: 13.5px;
    padding: 5px 12px; border-radius: 999px;
    color: var(--ink); background: #1a1d26;
    border: 1px solid var(--edge);
    cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  }
  button:hover { background: #232734; }
  button .eq { font-family: var(--serif); font-style: italic; }
  /* an active path button wears its own colour, set from the palette in JS */
  button.on { color: #06070a; font-weight: 700; }
  #btnApproach.running, #btnSpin.on, #btnTop.on {
    background: var(--blue); border-color: var(--blue);
    color: #06070a; font-weight: 600;
  }

  @media (max-width: 620px) {
    #top { padding: 6px 10px; }
    #eqcard { padding: 7px 10px 8px 10px; }
    #eqcard .sub { display: none; }
    .math { font-size: 15px; }
    #readout { min-width: 0; font-size: 12px; padding: 6px 9px 7px 9px; }
    #readout .row { font-size: 13px; }
    #caption { font-size: 12.5px; min-height: 28px; padding: 5px 10px; }
    .lbl { display: none; }
    button { font-size: 12.5px; padding: 4px 10px; }
  }
</style>
</head>

<body>
<div id="app">
  <div id="top">
    <div id="eqcard">
      <div class="math"><span style="color:#9cdceb"><i>f</i>(<i>x</i>,<i>y</i>) =
        <span class="frac"><span class="num"><i>xy</i></span><span class="den"><i>x</i>&#178; + <i>y</i>&#178;</span></span></span>
        &#8201;as (<i>x</i>,<i>y</i>) &#8594; (0,&#8202;0)</div>
      <div class="sub">the floor is the <i>xy</i>-plane; the surface above it is <i>z</i> = <i>f</i>(<i>x</i>,<i>y</i>)</div>
    </div>

    <div id="readout">
      <div class="title">along each path</div>
      <div id="rows"></div>
      <div id="verdict"></div>
    </div>
  </div>

  <div id="stage"></div>

  <div id="caption"></div>

  <div id="panel">
    <div class="row">
      <span class="lbl">Click a path:</span>
      <button class="pathBtn" data-i="0"><span class="eq">y</span> = 0</button>
      <button class="pathBtn" data-i="1"><span class="eq">x</span> = 0</button>
      <button class="pathBtn" data-i="2"><span class="eq">y</span> = <span class="eq">x</span></button>
      <span style="flex:1"></span>
      <button id="btnAll">Show all</button>
      <button id="btnClear">Clear</button>
    </div>
    <div class="row">
      <span class="lbl">View:</span>
      <button id="btnApproach">&#9654;&nbsp;Approach (0,&#8202;0)</button>
      <button id="btnTop">Top view</button>
      <button id="btnSpin">Spin</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  // Manim colour constants, so the palette below reads the way a Scene would.
  var BLUE_C = 0x58c4dd, BLUE_E = 0x1c758a, GREEN_C = 0x83c167,
      GOLD_C = 0xf0ac5f, RED_C = 0xfc6255, GREY = 0x8a8f9c, INK = 0xece6e2;

  // ---------- the construction ----------
  // f = xy/(x^2+y^2) is constant along every ray from the origin: in polar
  // coordinates it is (1/2) sin 2t, with no r in it at all.  That is the whole
  // story of the example, and it is why each lifted path below is a straight
  // horizontal line rather than a curve.
  function fPolar(t) { return 0.5 * Math.sin(2 * t); }

  var R_IN = 0.05, R_OUT = 1.7;      // the surface is drawn over this annulus
  var Z_FLOOR = -1.05;               // the xy-plane, drawn below the surface
  var LIFT = 0.02;                   // traces sit this far above the surface

  var PATHS = [
    { name: "y = 0", tex: "y = 0", theta: 0,               colour: GREEN_C,
      css: "#83c167", value: 0,   label: "f = 0" },
    { name: "x = 0", tex: "x = 0", theta: Math.PI / 2,     colour: BLUE_C,
      css: "#58c4dd", value: 0,   label: "f = 0" },
    { name: "y = x", tex: "y = x", theta: Math.PI / 4,     colour: GOLD_C,
      css: "#f0ac5f", value: 0.5, label: "f = \u00bd" }
  ];

  // ---------- renderer / scene ----------
  var stage = document.getElementById("stage");
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.appendChild(renderer.domElement);
  var canvas = renderer.domElement;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x06070a);

  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
  camera.up.set(0, 0, 1);                 // z is up, the usual maths convention

  var CENTER = new THREE.Vector3(0, 0, -0.3);
  var radius = 7.5, theta = -0.95, phi = 1.06;
  var targetPhi = null, targetTheta = null;   // set by the view buttons
  var aspect = 1;

  // CLOUD samples everything that is actually drawn, measured from CENTER, so
  // the camera can be dollied to the smallest distance that still shows all of
  // it from the current angle. A bounding sphere would leave this picture --
  // much wider than it is tall -- marooned in empty space.
  var CLOUD = (function () {
    var pts = [], k, t, rim = R_OUT * 1.2;
    for (k = 0; k < 16; k++) {
      t = 2 * Math.PI * k / 16;
      pts.push(new THREE.Vector3(rim * Math.cos(t), rim * Math.sin(t), Z_FLOOR));
      pts.push(new THREE.Vector3(rim * Math.cos(t), rim * Math.sin(t), fPolar(t) + 0.3));
    }
    return pts.map(function (p) { return p.sub(CENTER); });
  })();

  var _e = new THREE.Vector3(), _upv = new THREE.Vector3(), _rt = new THREE.Vector3();
  function computeRadius() {
    _e.set(Math.sin(phi) * Math.cos(theta), Math.sin(phi) * Math.sin(theta), Math.cos(phi));
    _upv.set(0, 0, 1).addScaledVector(_e, -_e.z);
    if (_upv.lengthSq() < 1e-9) _upv.set(0, 1, 0); else _upv.normalize();
    _rt.crossVectors(_upv, _e).normalize();

    var tanHalf = Math.tan(camera.fov * Math.PI / 360);
    var tanV = tanHalf, tanH = tanHalf * aspect, r = 1;
    for (var i = 0; i < CLOUD.length; i++) {
      var d = CLOUD[i], along = d.dot(_e);
      r = Math.max(r, along + Math.abs(d.dot(_upv)) / tanV,
                      along + Math.abs(d.dot(_rt)) / tanH);
    }
    radius = 1.06 * r;
    camera.far = 3 * radius;
    camera.updateProjectionMatrix();
  }

  function placeCamera() {
    computeRadius();
    camera.position.set(
      CENTER.x + radius * Math.sin(phi) * Math.cos(theta),
      CENTER.y + radius * Math.sin(phi) * Math.sin(theta),
      CENTER.z + radius * Math.cos(phi)
    );
    camera.lookAt(CENTER.x, CENTER.y, CENTER.z);
  }

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  var key = new THREE.DirectionalLight(0xffffff, 0.55); key.position.set(5, 3, 6);
  var fill = new THREE.DirectionalLight(0x9fd8ff, 0.28); fill.position.set(-4, -5, 2);
  scene.add(key); scene.add(fill);

  // ---------- text sprites ----------
  // Drawn in the book's serif. The webfont may still be loading when a sprite is
  // first painted, so every sprite is repainted once document.fonts settles.
  var LABELS = [];
  function paintLabel(rec) {
    var w = 256, h = 96, cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    var g = cv.getContext("2d");
    g.font = 'italic 52px "PT Serif", "Times New Roman", Times, serif';
    g.fillStyle = rec.colour;
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText(rec.text, w / 2, h / 2);
    var tex = new THREE.CanvasTexture(cv);
    tex.minFilter = THREE.LinearFilter;
    if (rec.sprite.material.map) rec.sprite.material.map.dispose();
    rec.sprite.material.map = tex;
    rec.sprite.material.needsUpdate = true;
  }
  function makeLabel(text, colour, scale) {
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({
      transparent: true, depthTest: false, opacity: 0
    }));
    sp.scale.set(scale * 2.667, scale, 1);   // canvas is 256 x 96
    var rec = { text: text, colour: colour, sprite: sp };
    LABELS.push(rec);
    paintLabel(rec);
    return sp;
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { LABELS.forEach(paintLabel); });
  }

  // ---------- the surface ----------
  // Vertex colours run from blue where f is negative to gold where it is
  // positive, so the two halves of the "saddle round the origin" read apart at
  // a glance; every ray keeps its colour all the way in, which is the point.
  var NR = 30, NT = 120;
  function surfaceColour(z) {
    var t = (z + 0.5), c = new THREE.Color();
    var lo = new THREE.Color(BLUE_C), mid = new THREE.Color(0x3a4150),
        hi = new THREE.Color(GOLD_C);
    if (t < 0.5) c.copy(lo).lerp(mid, t / 0.5);
    else c.copy(mid).lerp(hi, (t - 0.5) / 0.5);
    return c;
  }

  (function buildSurface() {
    var pos = [], col = [], idx = [], ir, it;
    for (ir = 0; ir <= NR; ir++) {
      // radii bunched towards the origin, where the surface does its twisting
      var s = ir / NR;
      var r = R_IN + (R_OUT - R_IN) * s * s;
      for (it = 0; it <= NT; it++) {
        var t = 2 * Math.PI * it / NT, z = fPolar(t);
        pos.push(r * Math.cos(t), r * Math.sin(t), z);
        var c = surfaceColour(z);
        col.push(c.r, c.g, c.b);
      }
    }
    for (ir = 0; ir < NR; ir++) {
      for (it = 0; it < NT; it++) {
        var a = ir * (NT + 1) + it, b = a + 1,
            d = a + (NT + 1), e = d + 1;
        idx.push(a, d, b, b, d, e);
      }
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    scene.add(new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
      vertexColors: true, transparent: true, opacity: 0.72,
      side: THREE.DoubleSide, shininess: 18, depthWrite: false
    })));

    // a coarse wireframe on top, the way a manim Surface carries its grid
    var wpos = [], step = 10;
    for (ir = 0; ir <= NR; ir += 5) {
      var s2 = ir / NR, r2 = R_IN + (R_OUT - R_IN) * s2 * s2;
      for (it = 0; it < NT; it++) {
        var t1 = 2 * Math.PI * it / NT, t2 = 2 * Math.PI * (it + 1) / NT;
        wpos.push(r2 * Math.cos(t1), r2 * Math.sin(t1), fPolar(t1),
                  r2 * Math.cos(t2), r2 * Math.sin(t2), fPolar(t2));
      }
    }
    for (it = 0; it < NT; it += step) {
      var t3 = 2 * Math.PI * it / NT, z3 = fPolar(t3);
      wpos.push(R_IN * Math.cos(t3), R_IN * Math.sin(t3), z3,
                R_OUT * Math.cos(t3), R_OUT * Math.sin(t3), z3);
    }
    var wgeo = new THREE.BufferGeometry();
    wgeo.setAttribute("position", new THREE.Float32BufferAttribute(wpos, 3));
    scene.add(new THREE.LineSegments(wgeo, new THREE.LineBasicMaterial({
      color: 0x8fa4b8, transparent: true, opacity: 0.16
    })));
  })();

  // ---------- the floor: the xy-plane the paths live in ----------
  (function buildFloor() {
    var g = [], n = 8, ext = R_OUT * 1.05, i;
    for (i = -n; i <= n; i++) {
      var u = ext * i / n;
      g.push(-ext, u, Z_FLOOR, ext, u, Z_FLOOR);
      g.push(u, -ext, Z_FLOOR, u, ext, Z_FLOOR);
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(g, 3));
    scene.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
      color: 0x39404e, transparent: true, opacity: 0.55
    })));

    var disc = new THREE.Mesh(
      new THREE.CircleGeometry(ext * 1.02, 64),
      new THREE.MeshBasicMaterial({ color: 0x0d1017, transparent: true,
                                    opacity: 0.85, side: THREE.DoubleSide })
    );
    disc.position.z = Z_FLOOR - 0.004;
    scene.add(disc);

    // the origin, the point every path is heading for
    var o = new THREE.Mesh(new THREE.SphereGeometry(0.055, 20, 14),
                           new THREE.MeshBasicMaterial({ color: INK }));
    o.position.set(0, 0, Z_FLOOR);
    scene.add(o);
    var oTag = makeLabel("(0, 0)", "#ece6e2", 0.3);
    oTag.position.set(-0.34, -0.34, Z_FLOOR + 0.12);
    oTag.material.opacity = 0.85;
    scene.add(oTag);
  })();

  // ---------- straight rods, used for both the paths and the traces ----------
  // three.js draws every line one pixel wide whatever the material says, so the
  // things the reader is meant to look at are thin cylinders instead.
  var ROD = new THREE.CylinderGeometry(1, 1, 1, 12, 1, true);
  ROD.translate(0, 0.5, 0);          // grows from its base along +y
  var _up = new THREE.Vector3(0, 1, 0), _dir = new THREE.Vector3();

  function rod(from, to, r, colour, opacity) {
    var m = new THREE.Mesh(ROD, new THREE.MeshBasicMaterial({
      color: colour, transparent: true, opacity: opacity === undefined ? 1 : opacity
    }));
    _dir.subVectors(to, from);
    var len = _dir.length();
    m.position.copy(from);
    m.quaternion.setFromUnitVectors(_up, _dir.clone().normalize());
    m.scale.set(r, len, r);
    m.userData.len = len;
    m.userData.r = r;
    return m;
  }
  function setRodProgress(m, t) {          // 0 = nothing drawn, 1 = the whole rod
    m.scale.set(m.userData.r, Math.max(1e-4, m.userData.len * t), m.userData.r);
    m.visible = t > 0.001;
  }

  // ---------- one bundle of objects per path ----------
  var pickable = [];

  PATHS.forEach(function (P, i) {
    var ct = Math.cos(P.theta), st = Math.sin(P.theta);
    var z = fPolar(P.theta);                   // the height of the lifted path
    P.z = z;
    P.group = new THREE.Group();
    scene.add(P.group);

    // the path itself, drawn on the floor in both directions and always there
    // to be clicked; it brightens when it is chosen
    P.floor = [
      rod(new THREE.Vector3(0, 0, Z_FLOOR),
          new THREE.Vector3(R_OUT * ct, R_OUT * st, Z_FLOOR), 0.028, P.colour, 0.38),
      rod(new THREE.Vector3(0, 0, Z_FLOOR),
          new THREE.Vector3(-R_OUT * ct, -R_OUT * st, Z_FLOOR), 0.028, P.colour, 0.38)
    ];
    P.floor.forEach(function (m) {
      m.userData.path = i;                     // what the raycaster reports
      P.group.add(m);
      pickable.push(m);
    });

    P.floorTag = makeLabel(P.tex, P.css, 0.32);
    P.floorTag.position.set(R_OUT * ct * 1.2, R_OUT * st * 1.2, Z_FLOOR + 0.12);
    P.floorTag.material.opacity = 0.55;
    P.group.add(P.floorTag);

    // the trace of the surface over that path: a horizontal line at height z,
    // drawn from the two far ends inwards
    P.trace = [
      rod(new THREE.Vector3(R_OUT * ct, R_OUT * st, z + LIFT),
          new THREE.Vector3(R_IN * ct, R_IN * st, z + LIFT), 0.036, P.colour),
      rod(new THREE.Vector3(-R_OUT * ct, -R_OUT * st, z + LIFT),
          new THREE.Vector3(-R_IN * ct, -R_IN * st, z + LIFT), 0.036, P.colour)
    ];
    P.trace.forEach(function (m) { m.visible = false; P.group.add(m); });

    // the walls that carry the path up onto the surface, drawn as a ladder of
    // short uprights rather than a solid sheet so the surface stays readable
    P.risers = [];
    for (var k = 1; k <= 7; k++) {
      var r = R_IN + (R_OUT - R_IN) * k / 7.5;
      [1, -1].forEach(function (sgn) {
        var m = rod(new THREE.Vector3(sgn * r * ct, sgn * r * st, Z_FLOOR),
                    new THREE.Vector3(sgn * r * ct, sgn * r * st, z),
                    0.008, P.colour, 0.5);
        m.visible = false;
        P.risers.push(m);
        P.group.add(m);
      });
    }

    // the value the path arrives at, marked on the trace next to the origin
    P.dot = new THREE.Mesh(new THREE.SphereGeometry(0.05, 18, 12),
                           new THREE.MeshBasicMaterial({ color: P.colour }));
    P.dot.position.set(-0.11 * ct, -0.11 * st, z + LIFT);
    P.dot.visible = false;
    P.group.add(P.dot);

    // the value sits on the half of the path opposite its name on the floor, so
    // the two never land on top of each other whichever way the picture is turned
    P.valueTag = makeLabel(P.label, P.css, 0.34);
    var vr = 0.72 + 0.26 * i;             // staggered, so no two values collide
    P.valueTag.position.set(-vr * ct, -vr * st, z + 0.26);
    P.valueTag.material.opacity = 0;
    P.group.add(P.valueTag);

    // the travelling point used by "Approach (0,0)"
    P.walker = new THREE.Mesh(new THREE.SphereGeometry(0.055, 18, 12),
                              new THREE.MeshBasicMaterial({ color: INK }));
    P.walkerLift = new THREE.Mesh(new THREE.SphereGeometry(0.055, 18, 12),
                                  new THREE.MeshBasicMaterial({ color: P.colour }));
    P.walker.visible = P.walkerLift.visible = false;
    P.group.add(P.walker); P.group.add(P.walkerLift);

    P.on = false;
    P.grow = 0;                                // 0..1, how much trace is drawn
  });

  // ---------- the readout ----------
  var rowsEl = document.getElementById("rows"),
      verdictEl = document.getElementById("verdict"),
      captionEl = document.getElementById("caption");

  function say(text) {
    captionEl.textContent = text;
    captionEl.classList.add("show");
  }

  function refreshReadout() {
    var chosen = PATHS.filter(function (P) { return P.on; });
    // every path keeps its row (with a dash until it is chosen), so the
    // readout -- and with it the stage below -- never changes height
    rowsEl.innerHTML = PATHS.map(function (P) {
      return '<div class="row' + (P.on ? '' : ' off') + '">' +
             '<span class="swatch" style="background:' + P.css + '"></span>' +
             '<span>along ' + P.tex + '</span>' +
             '<span class="val"' + (P.on ? ' style="color:' + P.css + '"' : '') + '>' +
             (P.on ? (P.value === 0.5 ? "&#189;" : "0") : "&#8212;") + '</span></div>';
    }).join("");
    if (!chosen.length) {
      verdictEl.classList.remove("show");
      return;
    }

    var values = chosen.map(function (P) { return P.value; });
    var differ = Math.max.apply(null, values) !== Math.min.apply(null, values);
    verdictEl.innerHTML = differ
      ? "0 &#8800; &#189; &#8212; the limit does not exist."
      : "";
    verdictEl.classList.toggle("show", differ);
  }

  function togglePath(i, force) {
    var P = PATHS[i];
    var on = force === undefined ? !P.on : force;
    if (on === P.on) return;
    P.on = on;
    document.querySelectorAll(".pathBtn")[i].classList.toggle("on", on);
    document.querySelectorAll(".pathBtn")[i].style.background = on ? P.css : "";
    document.querySelectorAll(".pathBtn")[i].style.borderColor = on ? P.css : "";
    P.floor.forEach(function (m) { m.material.opacity = on ? 1 : 0.38; });
    P.floorTag.material.opacity = on ? 1 : 0.55;
    if (!on) { stopApproach(); }
    refreshReadout();
    if (on) {
      say("Along " + P.tex + " the height of the surface is the same all the way in: f = " +
          (P.value === 0.5 ? "½" : "0") + ".");
    } else if (!PATHS.some(function (Q) { return Q.on; })) {
      say("Click a path on the floor, or a button below, to lift it onto the surface.");
    }
  }

  document.querySelectorAll(".pathBtn").forEach(function (b) {
    b.addEventListener("click", function () { togglePath(+b.dataset.i); });
  });
  document.getElementById("btnAll").addEventListener("click", function () {
    PATHS.forEach(function (P, i) { togglePath(i, true); });
    say("Two of the paths arrive at 0 and one arrives at ½: the value depends on the path.");
  });
  document.getElementById("btnClear").addEventListener("click", function () {
    PATHS.forEach(function (P, i) { togglePath(i, false); });
  });

  // ---------- picking a path in the picture ----------
  var raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
  var hoverPath = -1, dragged = false;

  function pointerToNDC(e) {
    var b = canvas.getBoundingClientRect();
    pointer.x = ((e.clientX - b.left) / b.width) * 2 - 1;
    pointer.y = -((e.clientY - b.top) / b.height) * 2 + 1;
  }
  function pick(e) {
    pointerToNDC(e);
    raycaster.setFromCamera(pointer, camera);
    var hits = raycaster.intersectObjects(pickable, false);
    return hits.length ? hits[0].object.userData.path : -1;
  }

  canvas.addEventListener("pointermove", function (e) {
    if (dragging) { dragged = true; return; }
    var i = pick(e);
    if (i !== hoverPath) {
      hoverPath = i;
      canvas.classList.toggle("pick", i >= 0);
    }
  });
  canvas.addEventListener("pointerleave", function () {
    hoverPath = -1; canvas.classList.remove("pick");
  });

  // ---------- drag to orbit ----------
  var dragging = false, lastX = 0, lastY = 0;
  canvas.addEventListener("pointerdown", function (e) {
    dragging = true; dragged = false; lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    if (Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY) > 2) dragged = true;
    targetPhi = targetTheta = null;
    theta -= (e.clientX - lastX) * 0.008;
    phi = Math.max(0.16, Math.min(Math.PI / 2 - 0.02, phi - (e.clientY - lastY) * 0.008));
    lastX = e.clientX; lastY = e.clientY;
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) {
    canvas.addEventListener(ev, function (e) {
      if (ev === "pointerup" && dragging && !dragged) {
        var i = pick(e);
        if (i >= 0) togglePath(i);
      }
      dragging = false;
    });
  });

  // ---------- the walk in to the origin ----------
  var walking = false, walkT = 0;
  var btnApproach = document.getElementById("btnApproach");

  function stopApproach() {
    walking = false;
    btnApproach.classList.remove("running");
    PATHS.forEach(function (P) { P.walker.visible = P.walkerLift.visible = false; });
  }
  btnApproach.addEventListener("click", function () {
    if (walking) { stopApproach(); return; }
    if (!PATHS.some(function (P) { return P.on; })) {
      PATHS.forEach(function (P, i) { togglePath(i, true); });
    }
    walking = true; walkT = 0;
    btnApproach.classList.add("running");
    say("Every point slides in towards (0, 0), but each one keeps the height of its own path.");
  });

  var btnTop = document.getElementById("btnTop");
  btnTop.addEventListener("click", function () {
    var top = !btnTop.classList.contains("on");
    btnTop.classList.toggle("on", top);
    targetPhi = top ? 0.18 : 1.06;
    targetTheta = top ? -Math.PI / 2 : -0.95;
    if (top) say("Seen from above, the three paths are just three lines through the origin.");
  });

  var spinning = false, btnSpin = document.getElementById("btnSpin");
  btnSpin.addEventListener("click", function () {
    spinning = !spinning;
    btnSpin.classList.toggle("on", spinning);
    if (spinning) { targetPhi = targetTheta = null; btnTop.classList.remove("on"); }
  });

  // ---------- resize / loop ----------
  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    aspect = w / h;
    camera.aspect = aspect;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);

  var clock = new THREE.Clock();
  var lastW = 0, lastH = 0;
  function tick() {
    var dt = Math.min(clock.getDelta(), 0.05);
    if (stage.clientWidth !== lastW || stage.clientHeight !== lastH) {
      lastW = stage.clientWidth; lastH = stage.clientHeight;
      resize();
    }

    PATHS.forEach(function (P) {
      // the trace grows in when the path is chosen and retreats when it is not
      var want = P.on ? 1 : 0;
      P.grow += Math.max(-1, Math.min(1, want - P.grow)) * Math.min(1, dt * 2.6);
      if (Math.abs(want - P.grow) < 0.002) P.grow = want;
      P.trace.forEach(function (m) { setRodProgress(m, P.grow); });
      P.dot.visible = P.grow > 0.9;
      P.valueTag.material.opacity = Math.max(0, (P.grow - 0.55) / 0.45);
      P.risers.forEach(function (m, k) {
        var need = (k / P.risers.length) * 0.8;
        m.visible = P.grow > need;
        m.material.opacity = 0.5 * P.grow;
      });
    });

    if (walking) {
      walkT += dt / 5.0;
      if (walkT >= 1) { walkT = 1; }
      // r shrinks geometrically, so the point keeps closing on the origin
      var r = R_OUT * Math.pow(R_IN / R_OUT, walkT);
      PATHS.forEach(function (P) {
        var vis = P.on && P.grow > 0.9;
        P.walker.visible = P.walkerLift.visible = vis;
        if (!vis) return;
        var ct = Math.cos(P.theta), st = Math.sin(P.theta);
        P.walker.position.set(r * ct, r * st, Z_FLOOR);
        P.walkerLift.position.set(r * ct, r * st, P.z + LIFT);
      });
      if (walkT === 1) {
        walking = false;
        btnApproach.classList.remove("running");
        say("The paths all reached (0, 0), but at heights 0, 0 and ½: the limit does not exist.");
      }
    }

    if (targetPhi !== null) {
      phi += (targetPhi - phi) * Math.min(1, dt * 3.2);
      theta += (targetTheta - theta) * Math.min(1, dt * 3.2);
      if (Math.abs(targetPhi - phi) < 0.002) { phi = targetPhi; theta = targetTheta; targetPhi = targetTheta = null; }
    }
    if (spinning && !dragging) theta += 0.3 * dt;

    placeCamera();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  resize();
  refreshReadout();
  say("Click a path on the floor, or a button below, to lift it onto the surface.");
  placeCamera();
  tick();
})();
</script>
</body>
</html>

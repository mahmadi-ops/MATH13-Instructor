function tex(el, s, size) {
  const d = document.createElement('div');

  katex.render(s, d, { throwOnError: false, displayMode: false });

    else t.textContent = n.t;

  if (n.m) for (const [s, size, note] of n.m) {
    const d = tex(el, s, size);

const touching = {};   // node id -> its incident edge paths and neighbour ids
for (const [a, b, kind] of EDGES) {
  const rectOf = id => { const el = stage.querySelector('[data-node="' + id + '"]'); return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight }; };
  const A = rectOf(a), B = rectOf(b);
  const acx = A.x + A.w / 2, acy = A.y + A.h / 2, bcx = B.x + B.w / 2, bcy = B.y + B.h / 2;
  let d;
  if (Math.abs(bcx - acx) > Math.abs(bcy - acy)) {
    const p1 = bcx > acx ? [A.x + A.w, acy] : [A.x, acy];
    const p2 = bcx > acx ? [B.x, bcy] : [B.x + B.w, bcy];
    const k = (p2[0] - p1[0]) * 0.45;
    d = `M${p1[0]},${p1[1]} C${p1[0] + k},${p1[1]} ${p2[0] - k},${p2[1]} ${p2[0]},${p2[1]}`;
  } else {
    const p1 = bcy > acy ? [acx, A.y + A.h] : [acx, A.y];
    const p2 = bcy > acy ? [bcx, B.y] : [bcx, B.y + B.h];
    const k = (p2[1] - p1[1]) * 0.45;
    d = `M${p1[0]},${p1[1]} C${p1[0]},${p1[1] + k} ${p2[0]},${p2[1] - k} ${p2[0]},${p2[1]}`;
  }

  p.setAttribute('stroke-width', '1.5');
  p.setAttribute('marker-end', kind === 'gold' ? 'url(#arr-gold)' : 'url(#arr-plain)');
  svg.appendChild(p);
  for (const id of [a, b]) {
    (touching[id] = touching[id] || { paths: [], nodes: [] });
    touching[id].paths.push(p);
    touching[id].nodes.push(id === a ? b : a);
  }
}

    svg.classList.add('focus'); stage.classList.add('focus');
    for (const p of inc.paths) p.classList.add('hi');
    for (const id of inc.nodes) stage.querySelector('[data-node="' + id + '"]').classList.add('hi');
  });
  el.addEventListener('mouseleave', () => {
    svg.classList.remove('focus'); stage.classList.remove('focus');
    for (const p of inc.paths) p.classList.remove('hi');
    for (const id of inc.nodes) stage.querySelector('[data-node="' + id + '"]').classList.remove('hi');
  });
}
// scale to fit embedding width
function fit() {
  const w = document.documentElement.clientWidth;
  const s = w / 1920;
  stage.style.transform = 'scale(' + s + ')';
  document.getElementById('wrap').style.height = (1080 * s) + 'px';
}
fit(); window.addEventListener('resize', fit);
</script>
</body>
